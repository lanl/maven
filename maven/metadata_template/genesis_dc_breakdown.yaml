                For legacy bibtex entries (that don''t accept eprinttype and eprint)
                and that need to support an ark or other identifiers that don''t fit
                cleanly into the existing fields, the note field can be used to capture
                this information in a free-text format. include a note: field use
                this format for the note field: note: Available at \url{ark:/12345/abcde}'
              value: __NOTE__
    integrity:
      required: false
      description: ""
      value:
        checksum_available:
          required: false
          description: ' "Yes" | "No"'
          type: radio
          options: ["Yes", "No"]
          value: __Yes|No__
        checksum_type:
          required: false
          description: '[required if checksum_available="Yes"] sha256 | sha512 | md5
            | other sha256 recommended; md5 not recommended for new datasets'
          value: __TYPE__
        checksum_value:
          required: false
          description: '[required if checksum_available="Yes"] Checksum of primary
            data file(s). For multi-file datasets, provide a checksum manifest and
            link here.'
          value: __VALUE__
        fixity_policy:
          required: false
          description: ' e.g., "Monthly sha256 verification
            via repository integrity service"'
          value: __POLICY__


governed_use:
  required: true
  description: "--- Use Governance -------------------------------------------------
     For datasets that are actively being used in workflows,
    or where use governance is needed to manage risks, ensure responsible use, or
    enable discoverability for specific use cases. Populate the fields that are relevant
    to the dataset's current, intended, permitted, out_of_scope, and prohibited use.
    current_use is required for governed_use_required; the other fields are optional
    but recommended to support responsible use and discoverability."
  value:
    use_governance:
      required: true
      description: Describes the current and intended use of this dataset, as well
        as any explicit permitted, out-of-scope, or prohibited uses. For datasets
        that are actively in use in workflows, or where use governance is needed to
        manage risks, ensure responsible use, or enable discoverability for specific
        use cases. 
      value:
        current_use:
          required: true
          description: " For in-workflow data: what is this
            dataset actively being used for right now? Distinct from intended_use."
          value: "${CURRENT_USE}"
        intended_use:
          required: false
          description: " Tasks or workflows this dataset
            is designed to support. e.g., ML training | physics analysis | benchmarking
            | visualization"
          value: __INTENDED_USE__
        permitted_use:
          required: false
          description: " Uses this dataset is suitable
            for, beyond the intended use. e.g., exploratory analysis | hypothesis
            generation | educational use"
          value: __PERMITTED_USE__
        out_of_scope_use:
          required: false
          description: " Uses this dataset should NOT
            be applied to. e.g., clinical decision-making | real-time control systems"
          value: __OUT_OF_SCOPE__
        prohibited_use:
          required: false
          description: " Uses that are explicitly prohibited
            for this dataset. e.g., any use involving human subjects | commercial
            applications | use in high-risk domains"
          value: __PROHIBITED_USE__
        need_to_know_basis:
          required: false
          description: ' If access is restricted based
            on a need-to-know basis, list the specific basis for the restriction.
            select one from list: "Mission_Need" | "Job_Duty" | "Project_Program_Association"
            | "Agreement_Defined" | "DGB_Exception_Waiver"'
          value: []
    non_sensitivity_governance_metadata:
      required: true
      description: Governance-relevant metadata that may affect sharing and use decisions
        but is not part of the source sensitivity or marking block itself (those are
        captured in discoverability.sensitivity). This block describes governance
        as it applies to the dataset as a whole — which may differ from the sensitivity
        or classification of any source data from which it was derived. 
        export control, privacy, right & release as it applies to the dataset as a
        whole, which may be distinct from the sensitivity or classification of the
        source data from which it was derived.
      value:
        export_control:
          required: true
          description: ""
          value:
            export_control_status:
              required: true
              description: ' select one from list: "Yes" | "No" | "Pending_Review" | "Unknown"'
              type: dropdown
              options: ["Yes", "No", "Pending_Review", "Unknown"]
              value: "${EXPORT_CONTROL_STATUS}"
            export_control_basis:
              required: false
              description: '[governed_use_if_applicable, required if export_control_status
                = "Yes"] select one from: ITAR | EAR | DOE_Nuclear_Export_Control | Other | not_applicable'
              type: dropdown
              options: [ITAR, EAR, DOE_Nuclear_Export_Control, Other, not_applicable]
              value: __EXPORT_CONTROL_BASIS__
            foreign_national_access_status:
              required: false
              description: " select one from list: Allowed | Restricted | Prohibited | Conditional | Unknown"
              type: dropdown
              options: [Allowed, Restricted, Prohibited, Conditional, Unknown]
              value: __ACCESS_STATUS__
        privacy:
          required: true
          description: ""
          value:
            privacy_status:
              required: true
              description: ' select one from list: "Yes" | "No" | "Pending_Review" | "Unknown"'
              type: dropdown
              options: ["Yes", "No", "Pending_Review", "Unknown"]
              value: "${PRIVACY_STATUS}"
            pii_status:
              required: true
              description: ' select one from list: "Yes" | "No" | "Pending_Review" | "Unknown"'
              type: dropdown
              options: ["Yes", "No", "Pending_Review", "Unknown"]
              value: __PII_STATUS__
            phi_status:
              required: true
              description: ' select one from list: "Yes" | "No" | "Pending_Review" | "Unknown"'
              type: dropdown
              options: ["Yes", "No", "Pending_Review", "Unknown"]
              value: __PHI_STATUS__
            privacy_control_basis:
              required: false
              description: " select all that apply: HIPPA
                | Privacy_Act | Human_Subjects | Other_Regulated_Privacy | Site_Specific | not_applicable"
              type: dropdown
              options: [HIPPA, Privacy_Act, Human_Subjects, Other_Regulated_Privacy, Site_Specific, not_applicable]
              value: []
            privacy_regime_notes:
              required: false
              description: " Optional notes for privacy
                regimes or handling nuances not captured by controlled values."
              value: __PRIVACY_NOTES__
        rights_release_records:
          required: true
          description: ""
          value:
            ip_restriction_type:
              required: false
              description: " select one from list: Proprietary
                | Limited_Rights | Restricted_Rights | Government_Purpose_Rights |
                Unlimited_Rights | Third_Party_Licensed | None"
              type: dropdown
              options: [Proprietary, Limited_Rights, Restricted_Rights, Government_Purpose_Rights, 
                        Unlimited_Rights, Third_Party_Licensed, None]
              value: __IP_RESTRICTION_TYPE__
            agreement_required:
              required: true
              description: ' select one from list: "Yes" |
                "No" — Is a rights release agreement required for use of this dataset?'
              type: radio
              options: ["Yes", "No"]
              value: "${AGREEMENT_REQUIRED}"
            agreement_type:
              required: false
              description: '[governed_use_if_applicable, required if agreement_required
                = "Yes"] list all that apply: DUA | CRADA | MOU | NDA | LICENSE |
                WFO | OTHER'
              value: []
            public_release_status:
              required: true
              description: ' select one from list: "Approved"
                | "Pending" | "Not_Approved" | "Requires_STI_Review"'
              type: dropdown
              options: [Approved, Pending, Not_Approved, Requires_STI_Review]
              value: "${PUBLIC_RELEASE_STATUS}"
            record_status:
              required: true
              description: ' select one from list: "Federal_Record"
                | "Contractor_Record" | "Non_Record" | "Mixed" | "Unknown"'
              type: dropdown
              options: [Federal_Record, Contractor_Record, Non_Record, Mixed, Unknown]
              value: "${RECORD_STATUS}"
    compliance:
      required: true
      description: 'Compliance confirmation fields. Populate when release_status =
        Under_Review \| Approved \| Published. Leave blank or omit for Draft and in-workflow
        datasets. All three fields use YesNoUnknownNotApplicableEnum: "Yes" \| "No"
        \| "Unknown" \| "not_applicable" — always use quoted strings. '
      value:
        doe_data_management_plan:
          required: true
          description: 'Whether a DOE Data Management Plan (DMP) is on file for this
            dataset. Use not_applicable if the dataset is not DOE-funded. 
            select one from list: "Yes" | "No" | "Unknown" | "not_applicable" — a
            DOE DMP is on file for this dataset'
          type: dropdown
          options: ["Yes", "No", "Unknown", "not_applicable"]
          value: "${DOE_DATA_MANAGEMENT_PLAN}"
        osti_elink2_metadata_compliant:
          required: true
          description: 'Whether the metadata in this data card complies with OSTI
            E-Link 2.0 API specifications. If unsure, check with your data manager
            before setting to "Yes".  select one from list:
            "Yes" | "No" | "Unknown" | "not_applicable" — metadata complies with OSTI
            E-Link 2 API specs'
          type: dropdown
          options: ["Yes", "No", "Unknown", "not_applicable"]
          value: "${OSTI_ELINK2_METADATA_COMPLIANT}"
        irb_approved:
          required: true
          description: 'Whether Institutional Review Board (IRB) approval has been
            obtained. Use not_applicable if the dataset does not involve human subjects
            — do not use "No", which implies an IRB review was needed but not obtained.
             select one from list: "Yes" | "No" | "Unknown"
            | "not_applicable" - IRB approval is in place for this dataset, if applicable'
          type: dropdown
          options: ["Yes", "No", "Unknown", "not_applicable"]
          value: "${IRB_APPROVED}"
    review_provenance_companion:
      required: false
      description: A running chronological history of all formal reviews this dataset
        has undergone or is currently undergoing. Add one entry per review event.
        Do not overwrite or delete prior entries — this is an append-only record that
        supports audit and compliance. This block allows multiple review records to
        be captured in a structured format, which is especially useful for datasets
        that have undergone multiple reviews or have complex review histories.
        This is especially useful to track the provenance of the review.
      value:
        source_review_reference:
          required: false
          description: e.g., internal_qa | security | export_control | irb | partner | publication | other
          value: __REVIEW_REFERENCE__
        review_purpose:
          required: false
          description: Freetext description of why this review was conducted, 
            e.g., "Export control review prior to public release"
          value: __PURPOSE__
        source_review_authority:
          required: false
          description: 'e.g., "DOE Export Control Officer" | "ORNL IRB"'
          value: __AUTHORITY__
        review_contact_name:
          required: false
          description: Name of the primary contact for this review, if applicable
          value: __CONTACT_NAME__
        review_contact_email:
          required: false
          description: Email of the primary contact for this review, if applicable
          value: __CONTACT_EMAIL__
        reviewed_by:
          required: false
          description: 'Person or organization that conducted the review. Populate only the matching sub-block based on type and delete the other.'
          value:
            type:
              required: false
              description: 'person | organization'
              type: dropdown
              options: [person, organization]
              value: __TYPE__
            person:
              required: false
              conditional_context: "one_of_alternatives"
              condition_discriminator: "type"
              description: "Required when type is 'person'. Delete if using organization."
              value:
                given_name:
                  required: false
                  description: ""
                  value: __GIVEN_NAME__
                family_name:
                  required: false
                  description: ""
                  value: __FAMILY_NAME__
                email:
                  required: false
                  description: ""
                  value: __EMAIL__
                ror_id:
                  required: false
                  description: ""
                  value: __ROR_ID__
            organization:
              required: false
              conditional_context: "one_of_alternatives"
              condition_discriminator: "type"
              description: "Required when type is 'organization'. Delete if using person."
              value:
                name:
                  required: false
                  description: ""
                  value: __ORG_NAME__
                ror_id:
                  required: false
                  description: ""
                  value: __ROR_ID__
        decontrol_or_declassify_on:
          required: false
          description: ISO 8601 date ("YYYY-MM-DD") when this dataset will be decontrolled
            or declassified, if known. Use "not_applicable" for datasets that are
            not export-controlled or classified.
          value: __YYYY-MM-DD__
        review_date:
          required: false
          description: ISO 8601 date ("YYYY-MM-DD") the review was completed or last
            updated. Use "not_applicable" if not yet completed.
          value: __YYYY-MM-DD__
        comments:
          required: false
          description: Reviewer notes, conditions, or required follow-up actions
          value: __COMMENTS__


ai_usability:
  required: true
  description: "Required for the ai_usability intended capability, or for any dataset used
    in AI/ML training, inference, or evaluation workflows, or
    where semantic interoperability and verifiable integrity
    are needed."
  value:
    ai_usage:
      required: true
      description: "Describes whether and how this dataset may be used in AI/ML workflows.
        Be explicit — these fields are read by automated pipeline tooling."
      value:
        training_use_status:
          required: true
          description: ' "Yes" | "No" | "Conditional"'
          type: dropdown
          options: ["Yes", "No", "Conditional"]
          value: "${TRAINING_USE_STATUS}"
        training_use_conditions:
          required: false
          description: '[ai_usability_if_applicable, required if training_use_status
            is "Conditional"] e.g., "Only for non-commercial research" | "Requires citation of SAND2024-XXXXX"'
          value: "${TRAINING_USE_CONDITIONS}"
        inference_use_status:
          required: true
          description: ' "Yes" | "No" | "Conditional"'
          type: dropdown
          options: ["Yes", "No", "Conditional"]
          value: "${INFERENCE_USE_STATUS}"
        inference_use_conditions:
          required: false
          description: '[ai_usability_if_applicable, required if inference_use_status
            is "Conditional"] e.g., "Only for non-commercial research" | "Requires citation of SAND2024-XXXXX"'
          value: "${INFERENCE_USE_CONDITIONS}"
        evaluation_use_status:
          required: true
          description: ' "Yes" | "No" | "Conditional"'
          type: dropdown
          options: ["Yes", "No", "Conditional"]
          value: "${EVALUATION_USE_STATUS}"
        evaluation_use_conditions:
          required: false
          description: '[ai_usability_if_applicable, required if evaluation_use_status
            is "Conditional"] e.g., "Only for non-commercial research" | "Requires citation of SAND2024-XXXXX"'
          value: "${EVALUATION_USE_CONDITIONS}"
        restrictions:
          required: true
          description: ' e.g., "Not for clinical decision-making" | "None"'
          value: "${RESTRICTIONS}"
        bias_risks:
          required: true
          description: ' e.g., "Overrepresents samples from facility X" | "None"'
          value: "${BIAS_RISKS}"
        safety_considerations:
          required: true
          description: ' e.g., "Outputs may be export-controlled" | "None"'
          value: "${SAFETY_CONSIDERATIONS}"
        human_review_required:
          required: true
          description: ' "Yes" | "No"'
          type: radio
          options: ["Yes", "No"]
          value: "${HUMAN_REVIEW_REQUIRED}"
