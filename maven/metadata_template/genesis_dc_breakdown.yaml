accessibility:
  required: true
  description: 'Describes who can access this dataset and under what conditions. Access policy
    for the dataset. Describes the access level and any restrictions or requirements
    for accessing the dataset, which is critical information for users to understand
    how they can access the dataset and any potential barriers to access. Access policy
    is DISTINCT from sensitivity, which describes the nature of the data and its potential
    risks) and from release status (which describes the publication state of the dataset).
    access_policy.access_level is a required field that indicates the level of permissions
    required for users to access the dataset, following AccessLevelEnum. - open: no
    additional permissions required beyond standard account registration and agreement
    to terms of service. This indicates that the dataset is freely accessible to the
    public and can be used without any special permissions or restrictions. Note that
    "open" does not necessarily mean that the dataset is free of copyright or other
    legal restrictions, but rather that there are no additional access controls in
    place. Users may still need to comply with any applicable laws or regulations
    when using the dataset. - restricted: access may be granted to users who meet
    certain criteria, such as being part of a specific research community, having
    a legitimate research purpose, or agreeing to specific terms and conditions. This
    indicates that the dataset is not freely accessible to the public and that users
    must meet certain requirements or restrictions in order to access it. The specific
    criteria for access may vary depending on the dataset and the organization providing
    it, but could include things like institutional affiliation, research purpose,
    or agreement to specific terms and conditions. - controlled: access is tightly
    controlled and may require specific authorization, agreements, or approvals. This
    indicates that the dataset contains sensitive information and that only authorized
    users can access it.'
  value:
    access_policy:
      required: true
      description: ""
      value:
        access_level:
          required: true
          description: " Open | Restricted | Controlled"
          type: dropdown
          options: [Open, Restricted, Controlled]
          value: "${LEVEL}"
        access_restrictions:
          required: false
          description: ' Freetext description of access
            restrictions. e.g., "Requires signed DUA" | "None - publicly accessible"'
          value: __RESTRICTIONS__
        authorization_required:
