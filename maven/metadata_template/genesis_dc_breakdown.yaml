        from discoverability.datacard.sensitivity, the sensitivity of the data card
        document itself. See Sensitivity — two independent fields in Part 1. This
        structure is intended to preserve authoritative source markings/designations
        while minimizing redundant manual entry, separating actual source marking/control
        information from adjacent governance metadata (export control, privacy, rights,
        release, and records status — captured in governed_use). This sub-block shares
