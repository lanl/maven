        described by this data card, which may differ from the sensitivity of the
        data card itself. Populate based on the sensitivity of the dataset alone,
        not the data card. See NOTE ON SENSITIVITY above.
      value:
        overall_sensitivity:
          required: true
          description: " The overall sensitivity of THE
            DATASET only. Set based solely on the sensitivity of this dataset. not
            the data card it describes. See NOTE ON SENSITIVITY above. The sensitivity
            of the data card and the dataset are independent and will often differ.
            Uses a controlled vocabulary: - Public: No sensitivity; publicly shareable.
            - Unclassified_Uncontrolled: Unclassified but uncontrolled; may have minimal
            sensitivity; generally shareable with minimal controls. - CUI: CUI (Controlled
            Unclassified Information); requires handling per CUI guidelines; access
            controls required. - UCNI: UCNI (Unclassified Controlled Nuclear Information);
            requires handling per UCNI guidelines; strict access controls required.
            - Classified: Classified information; requires handling per classification
            level and guide; strict access controls required. - Legacy_Controlled:
            Legacy controlled information; may have specific handling requirements
            based on legacy controls; access controls required. - Mixed: Mixed sensitivity;
            contains a combination of sensitive and non-sensitive information; handling
            requirements depend on the specific content; access controls required.
