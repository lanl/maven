reusability:
  required: true
  description: ' Information about the reusability of this dataset,
    such as license and rights, stewardship, data_quality, integrity, citation and
    stewardship information.'
  value:
    license:
      required: false
      description: ' Important: Required when release_status = Approved
        | Published. Use "pending" if not yet assigned. Includes information about the
        license governing use of the dataset, as well as any additional legal rights statements.
        NOTE ON LICENSES AND GOVERNANCE: A public/open license is not always the governing
        instrument for use, some controlled datasets may not have an SPDX-style reuse
        license at all, and use may instead be governed by contract, agreement, institutional
        review, or repository policy.'
      value:
        spdx_id:
          required: false
          description: 'Use Other if the license is not in the SPDX registry.
            Use pending if not yet assigned. SPDX license identifier: https://spdx.org/licenses/ 
            e.g., CC-BY-4.0 | CC0-1.0 | Apache-2.0 | MIT'
          value: __SPDX_ID__
        name:
          required: false
          description: Required if spdx_id = Other — the human-readable license name.
          value: __LICENSE_NAME__
        url:
          required: false
          description: URL to the full license text, or LICENSE.md if the license
            file is in the same repository as the dataset. URL to license text or "LICENSE.md" for repo-local file
          value: __LICENSE_URL__
        known_contractual_rights:
          required: false
          description: 'Legal rights statement, separate from license. Important because DOE/NNSA
            datasets may have complex contractual arrangements that impact how the
            data can be used and shared beyond license terms. e.g., "Government has
            unlimited rights" e.g., "Contractor retains rights with government license"'
          value: __RIGHTS__
    additional_licenses:
      required: false
      description: Additional licenses that apply to subsets of the dataset — for
        example, if the dataset contains third-party data under different licensing
        terms. Each entry uses the same sub-fields as reusability.license above, plus
        a description field explaining which subset of the data the entry applies
        to. List of additional licenses that apply to subsets of the dataset, if any. 
        e.g., if a dataset contains third-party data with different licensing terms, 
        those can be captured here. Each entry should include the same fields as the main 
        license block above, along with a description of which subset of the data it applies to.
      value: []
    stewardship:
      required: false
      description: 'Describes ongoing maintenance responsibilities and versioning
        approach for this dataset. Note on versioning: three fields work together
        to fully describe versioning. discoverability.identification.version carries
        the version number; identification.supersedes / identification.superseded_by
        link versions together; and stewardship.versioning_strategy describes how
        versioning is managed over time.  Information about
        the stewardship of this dataset, including who is responsible for maintaining
        it and how versioning is managed over time.'
      value:
        level:
          required: false
          description: " Select one: Project_Managed | Repository_Managed | Externally_Managed | not_applicable"
          type: dropdown
          options: [Project_Managed, Repository_Managed, Externally_Managed, not_applicable]
          value: __LEVEL__
        maintainer:
          required: false
          description: " Person or organization responsible
            for ongoing maintenance."
          value:
            type:
              required: true
              description: person | organization
              type: dropdown
              options: [person, organization]
              value: __TYPE__
            person:
              required: false
              conditional_context: "one_of_alternatives"
              condition_discriminator: "type"
              description: "Required when type is 'person'. Delete if using organization."
              value:
                given_name:
                  required: true
                  description: ""
                  value: __GIVEN_NAME__
                family_name:
                  required: true
                  description: ""
                  value: __FAMILY_NAME__
                orcid:
                  required: false
                  description: " Required where DOE employee/contractor
                    author policy applies, if locally applicable"
                  value: __ORCID__
                email:
                  required: false
                  description: ""
                  value: __EMAIL__
                affiliation:
                  required: false
                  description: " Organization affiliation."
                  value:
                    name:
                      required: false
                      description: ""
                      value: __ORG_NAME__
                    ror_id:
                      required: false
                      description: ""
                      value: __ROR_ID__
            organization:
              required: false
              conditional_context: "one_of_alternatives"
              condition_discriminator: "type"
              description: "Required when type is 'organization'. Delete if using person."
              value:
                name:
                  required: true
                  description: ""
                  value: __ORG_NAME__
                ror_id:
                  required: false
                  description: ""
                  value: __ROR_ID__
        update_frequency:
          required: false
          description: "None | Ad_Hoc | Monthly | Quarterly | Annually | Continuously | Other"
          type: dropdown
          options: [None, Ad_Hoc, Monthly, Quarterly, Annually, Continuously, Other]
          value: __FREQ__
