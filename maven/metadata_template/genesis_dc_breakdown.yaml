---
# ============================================================================
# Genesis Data Card Breakdown Schema v1.2
# ============================================================================
#
# PURPOSE: This file provides a structured index of all fields in the Genesis
# Data Card schema, including field paths, types, basic requirements, and
# machine-readable descriptions.
#
# CONDITIONAL REQUIREMENTS:
# Some fields use "one-of" patterns where multiple alternatives exist but only
# ONE should be populated based on a discriminator field. For example:
#   - authors.type determines whether to use authors.person OR authors.organization
#   - created_by.creator.agent_type determines person | organization | ai_model | software
#
# These alternatives are marked with:
#   conditional_context: "one_of_alternatives"
#   condition_discriminator: "<field_name>"
#
# Within each alternative, required: true means "required IF this alternative
# is selected". The reference guide (genesis_dc_v1.2_reference_guide.md) is the
# authoritative source for understanding which alternative to select.
#
# For detailed field descriptions, conditional logic, controlled vocabularies,
# and examples, always consult: genesis_dc_v1.2_reference_guide.md
# ============================================================================

supports_discoverability:
  required: true
  description: Dataset can be found and identified in catalogs. Required for every
    data card, with no exceptions. "Yes" (only valid value — always required and always
    Yes) [required] "Yes" is required as all data cards must support basic discovery
    and identification of the dataset. "Yes" is required for all data cards.
  value: 'Yes'


supports_accessibility:
  required: true
  description: Data card includes the metadata needed for others to know how to access
    the dataset (account, agreement, location, etc.). Recommended for all; required
    for datasets being shared. "No" [required] Set to "Yes" if this data card includes
    the metadata to support accessibility of the dataset. Required for data cards
    describing datasets that are shared or published. Does not necessary indicate
    that the dataset itself is accessible, only that the data card includes all the
    metadata to support accessibility.
  value: ${"Yes|No"}


supports_interoperability:
  required: true
  description: Data card includes the metadata needed to integrate or combine this
    dataset with others (formats, schema, provenance). "No" [required] Set to "Yes"
    if this data card includes the metadata to support interoperability of the dataset.
    Does not necessary indicate that the dataset itself is interoperable, only that
    the data card includes all the metadata to support interoperability.
  value: ${"Yes|No"}


supports_reusability:
  required: true
  description: Data card includes licensing, stewardship, data quality, and citation
    metadata needed for reuse. "No" [required] Set to "Yes" if this data card includes
    the metadata to support reusability of the dataset. Does not necessary indicate
    that the dataset itself is reusable, only that the data card includes some metadata
    to support reusability.
  value: ${"Yes|No"}


supports_governed_use:
  required: true
  description: Data card includes governance metadata (export control, privacy, rights,
    compliance, review history) for datasets subject to oversight. "No" [required]
    Set to "Yes" if this data card includes the metadata to support governed use of
    the dataset. Does not necessary indicate that the dataset itself is cleared for
    governed use, only that the data card includes some metadata to support governed
    use.
  value: ${"Yes|No"}


supports_ai_usability:
  required: true
  description: Data card includes the metadata needed for AI/ML training, inference,
    or evaluation use. "No" [required] Set to "Yes" if this data card includes the
    metadata to support AI usability of the dataset. Does not necessary indicate that
    the dataset itself is AI-usable, only that the data card includes some metadata
    to support AI usability.
  value: ${"Yes|No"}


discoverability:
  required: true
  description: "Required for all datasets regardless of publication state other intended capabilities. 
    Populate the fields marked [discoverability_required] to support basic discovery and identification 
    of this dataset, and to provide essential context for understanding the dataset's sensitivity and use. 
    Population discoverability_if_applicable fields is optional but recommended to further enhance 
    discoverability and support responsible use."
  value:
    datacard:
      required: true
      description: DATA CARD METADATA Describes this document itself — not the dataset.
      value:
        template_version:
          required: true
          description: " DO NOT MODIFY — used by parsers to apply version-specific logic"
          value: '1.2'
        datacard_version:
          required: true
          description: " Version of this specific data card
            document. Increment when the data card is meaningfully updated. Use semantic
            versioning: MAJOR.MINOR.PATCH e.g., 1.0 → 1.1 for content updates; 1.x
            → 2.0 for structural changes"
          value: '1.0'
        filename:
          required: true
          description: " Follow naming convention; align
            with identification.name; use genesis_datacard_other for datasets that
            are not part of a Genesis project or sub-project."
          value: genesis_datacard_${SNAKE_CASE_DATASET_NAME}.md
        language:
          required: true
          description: " ISO 639-1 language code for this data card's content"
          value: en
        id:
          required: false
          description: " Persistent identifier for
            this data card document itself, distinct from the dataset identifier.
            Assign if the data card is registered in a catalog or repository independently
            of the dataset."
          value:
            type:
              required: false
              description: doi | ark | handle | url | local | other
              type: dropdown
              options: [doi, ark, handle, url, local, other]
              value: __TYPE__
            value:
              required: false
              description: " the identifier value"
              value: __VALUE__
        sensitivity:
          required: true
          description: Sensitivity of the DATA CARD itself, which may differ from
            the sensitivity of the dataset it describes. Populate based on the sensitivity
            of the data card content alone, not the dataset. See NOTE ON SENSITIVITY
            above.
          value:
            overall_sensitivity:
              required: true
              description: " The overall sensitivity of
                THE DATA CARD only. Set based solely on the sensitivity of this data
                card. not the dataset it describes. See NOTE ON SENSITIVITY above.
                The sensitivity of the data card and the dataset are independent and
                will often differ. Uses a controlled vocabulary: - Public: No sensitivity;
                publicly shareable. - Unclassified_Uncontrolled: Unclassified but
                uncontrolled; may have minimal sensitivity; generally shareable with
                minimal controls. - CUI: CUI (Controlled Unclassified Information);
                requires handling per CUI guidelines; access controls required. -
                UCNI: UCNI (Unclassified Controlled Nuclear Information); requires
                handling per UCNI guidelines; strict access controls required. - Classified:
                Classified information; requires handling per classification level
                and guide; strict access controls required. - Legacy_Controlled: Legacy
                controlled information; may have specific handling requirements based
                on legacy controls; access controls required. - Mixed: Mixed sensitivity;
                contains a combination of sensitive and non-sensitive information;
                handling requirements depend on the specific content; access controls
                required. - Other_Controlled: Other controlled information; may have
                specific handling requirements based on other controls; access controls
                required."
              type: dropdown
              options: ["Public: No sensitivity; publicly shareable", 
                        "Unclassified_Uncontrolled: Unclassified but uncontrolled",
                        "CUI: CUI (Controlled Unclassified Information)",
                        "UCNI: UCNI (Unclassified Controlled Nuclear Information)",
                        "Classified: Classified information; requires handling per classification level and guide;",
                        "Legacy_Controlled: Legacy controlled information;",
                        "Mixed: Mixed sensitivity; contains a combination of sensitive and non-sensitive information;",
                        "Other_Controlled: Other controlled information;"]
              value: "${OVERALL_SENSITIVITY}"
            source_marking_string:
              required: true
              description: " If this data card has a source
                marking, provide the marking string exactly as it appears on the data
                card. Otherwise the source marking is None."
              value: "${STRING}"
            source_marking_scheme:
              required: true
              description: 'If this data card has a source
                marking, provide the marking scheme used. use vocabulary: DOE_CUI
                | DOE_UCNI | EO13526_Classified | AEA_RD_FRD_TFNI | DOD_CUI | DHS_CUI
                | Legacy_OUO | Legacy_Site_Specific | Other_Agency | None if a Legacy_OUO
                is unresolved to a current standard marking, normalized_control_basis
                should be populated as "Legacy_Needs_Mapping" to indicate that the
                control basis is legacy and needs interpretation for governance purposes.
                Otherwise the source marking is None.'
              type: dropdown
              options: [DOE_CUI, DOE_UCNI, EO13526_Classified, AEA_RD_FRD_TFNI, DOD_CUI, DHS_CUI, Legacy_OUO, 
                        Legacy_Site_Specific, Other_Agency, None]
              value: "${SCHEME}"
            classified_status:
              required: true
              description: ' "Yes" | "No" description: Indicates
                whether the asset is classified.'
              type: radio
              options: ["Yes", "No"]
              value: "${STATUS}"
            classification_level:
              required: false
              description: " For classified information,
                Top_Secret | Secret | Confidential classification level"
              type: dropdown
              options: [Top_Secret, Secret, Confidential, None]
              value: __LEVEL__
            classification_category:
              required: false
              description: " For classified information,
                list the classification category or categories, if applicable. use
                vocabulary: NSI | RD | FRD | TFNI | Other_Classified"
              type: dropdown
              options: [Top_Secret, Secret, Confidential, None]
              value: []
            classified_control_markings:
              required: false
              description: ' For classified information,
                list the specific control markings that apply, if any. Provide as
                a list of unique entries if multiple markings apply. e.g., - "NOFORN"
                - "CNWDI" - "SIGMA 14" - "REL TO USA, CAN, GBR" - "ORCON"'
              value: []
            cui_status:
              required: true
              description: ' "Yes" | "No" description: Indicates
                whether the asset is CUI.'
              type: radio
              options: ["Yes", "No"]
              value: "${STATUS}"
            cui_basic_categories:
              required: false
              description: '[discoverability_if_applicable, at least one basic or
                specified category is required if cui_status = "Yes"] For CUI, list
                the basic category or categories that apply, if any. use DOE/ISOO-authoritative
                CUI Basic categories or subcategories. provide as a list of unique
                entries if multiple categories apply.'
              value: []
            cui_specified_categories:
              required: false
              description: '[discoverability_if_applicable, at least one basic or
                specified category is required if cui_status = "Yes"] For CUI, list
                the specified category or categories that apply, if any. use DOE/ISOO-authoritative
                CUI Specified categories or subcategories. provide as a list of unique
                entries if multiple categories apply.'
              value: []
            cui_limited_dissemination_controls:
              required: false
              description: ' List the applicable CUI
                limited dissemination controls, if any. provide as a list of unique
                entries if multiple controls apply. e.g., - "NOFORN" - "DL ONLY" -
                "REL TO USA, GBR" - "DISPLAY ONLY USA, GBR" - "RELIDO" If cui_limited_dissemination_controls
                contains NOFORN, REL TO..., DISPLAY ONLY..., or similar controls,
                foreign_national_access_status should be consistent with those controls.'
              value: []
            ucni_status:
              required: true
              description: ' "Yes" | "No" description: Indicates
                whether the asset contains UCNI. UCNI is represented separately and
                should not be treated as an ordinary CUI category value.'
              type: radio
              options: ["Yes", "No"]
              value: "${STATUS}"
            uk_mda_status:
              required: false
              description: ' "Yes" | "No"| "Unknown"
                | "not_applicable" Indicates whether the asset is subject to UK Ministry
                of Defence Assessment (MDA) controls.'
              type: dropdown
              options: ["Yes", "No", "Unknown"]
              value: __STATUS__
            legacy_label_source:
              required: false
              description: ' Preserves deprecated or
                local historical control labels such as OUO, SBU, if source_marking_scheme
                = Legacy_OUO, legacy_label_source should be populated or site-specific
                legacy markings as provenance/source information only. Provide as
                a list of unique entries if multiple legacy labels apply. E.g., -
                "OUO" - "SBU"'
              value: []
            normalized_control_basis:
              required: false
              description: ' Optional interpreted control
                basis used for governance where source materials This does not replace
                authoritative source markings. Provide as a list of unique entries
                if multiple control bases apply. If source_marking_scheme = Legacy_OUO
                and the legacy marking is unresolved to a current standard marking,
                this should be populated as "Legacy_Needs_Mapping" to indicate that
                the control basis is legacy and needs interpretation for governance
                purposes. Entries should use this controlled vocabulary: - "Classified"
                - "CUI" - "UCNI" - "Public_Release_Approved" - "Legacy_Needs_Mapping"
                - "Other_Controlled"'
              type: dropdown
              options: [Classified, CUI, UCNI, Public_Release_Approved, Legacy_Needs_Mapping, Other_Controlled, None]
              value: __BASIS__
        created_date:
          required: true
          description: " ISO 8601 date this data card was
            first created"
          value: "${YYYY-MM-DD}"
        updated_date:
          required: false
          description: " ISO 8601 date of most recent
            update; revise on every change"
          value: __YYYY-MM-DD__
        change_log:
          required: true
          description: " Running history of meaningful changes
            to this data card. Add a new entry every time the data card is updated.
            Do not overwrite or delete prior entries."
          value:
            change_date:
              required: true
              description: " ISO 8601 date of this change"
              value: "${YYYY-MM-DD}"
            data_card_version:
              required: true
              description: " Running history of meaningful
                changes to this data card. Add a new entry every time the data card
                is updated. Do not overwrite or delete prior entries."
              value: '1.0'
            summary:
              required: true
              description: " Running history of meaningful
                changes to this data card. Add a new entry every time the data card
                is updated. Do not overwrite or delete prior entries."
              value: "${SUMMARY}"
        creation_method:
          required: true
          description: " Method used to create or most recently
            update this data card. Manual | Automated | Hybrid"
          value: "${METHOD}"
        created_by:
          required: true
          description: " All individuals, organizations,
            AI models, or software tools that created or updated this data card. List
            in chronological order of contribution — e.g., if an AI model generated
            the initial draft and a person then edited it, list the AI model first."
          value:
            contribution_date:
              required: true
              description: " ISO 8601 date of this specific
                contribution"
              value: "${YYYY-MM-DD}"
            description:
              required: false
              description: " Describe what this contributor did.
                e.g., 'Automated generation of data card from dataset metadata'
                e.g., 'Reviewed and corrected AI-generated content'"
              value: __DESCRIPTION__
            creator:
              required: true
              description: " person | organization | ai_model | software
                add one block per creator; 
                list the block that corresponds to the parent {ROLE} contributed to the creation of this data card.
                Delete the three blocks below that do not apply."
              value:
                agent_type:
                  required: true
                  description: "person | organization | ai_model | software. TYPE: person — use for a human contributor"
                  type: dropdown
                  options: [person, organization, ai_model, software]
                  value: "${TYPE}"
                person:
                  required: false
                  conditional_context: "one_of_alternatives"
                  condition_discriminator: "agent_type"
                  description: "Required when agent_type is 'person'. Delete if using organization, ai_model, or software."
                  value:
                    given_name:
                      required: true
                      description: ""
                      value: "${GIVEN_NAME}"
                    family_name:
                      required: true
                      description: ""
                      value: "${FAMILY_NAME}"
                    orcid:
                      required: false
                      description: " Format: https://orcid.org/0000-0000-0000-0000
                        Required where DOE employee/contractor author policy applies, if locally applicable"
                      value: __ORCID__
                    email:
                      required: true
                      description: ""
                      value: "${EMAIL}"
                    affiliation:
                      required: true
                      description: ""
                      value:
                        name:
                          required: true
                          description: ""
                          value: "${ORG_NAME}"
                        ror_id:
                          required: false
                          description: " Format: https://ror.org/XXXXXXX
                            Look up at https://ror.org"
                          value: __ROR_ID__
                    role:
                      required: false
                      description: " list from roles extending the CRediT taxonomy:
                        Conceptualization | Data_Curation | Formal_Analysis | Funding_Acquisition | Investigation | Methodology |
                        Project_Administration | Resources | Software | Supervision | Validation | Visualization | 
                        Writing_Original_Draft | Writing_Review_Editing | Data_Collection | Other"
                      type: dropdown
                      options: [Conceptualization, Data_Curation, Formal_Analysis, Funding_Acquisition, Investigation, Methodology,
                                Project_Administration, Resourcesm, Software, Supervision, Validation, Visualization,
                                Writing_Original_Draft, Writing_Review_Editing, Data_Collection, Other]
                      value:
                        __ROLE__
                organization:
                  required: false
                  conditional_context: "one_of_alternatives"
                  condition_discriminator: "agent_type"
                  description: "Required when agent_type is 'organization'. Delete if using person, ai_model, or software."
                  value:
                    name:
                      required: true
                      description: ""
                      value: "${ORG_NAME}"
                    ror_id:
                      required: true
                      description: ""
                      value: __ROR_ID__
                    role:
                      required: false
                      description: " list from roles extending the CRediT taxonomy:
                        Conceptualization | Data_Curation | Formal_Analysis | Funding_Acquisition | Investigation | Methodology |
                        Project_Administration | Resources | Software | Supervision | Validation | Visualization | 
                        Writing_Original_Draft | Writing_Review_Editing | Data_Collection | Other"
                      type: dropdown
                      options: [Conceptualization, Data_Curation, Formal_Analysis, Funding_Acquisition, Investigation, Methodology,
                                Project_Administration, Resourcesm, Software, Supervision, Validation, Visualization,
                                Writing_Original_Draft, Writing_Review_Editing, Data_Collection, Other]
                      value:
                        __ROLE__
                ai_model:
                  required: false
                  conditional_context: "one_of_alternatives"
                  condition_discriminator: "agent_type"
                  description: "Required when agent_type is 'ai_model'. Delete if using person, organization, or software. e.g., Claude 3.5 Sonnet | GPT-4o | Llama 3"
                  value:
                    name:
                      required: true
                      description: ""
                      value: "${MODEL_NAME}"
                    version:
                      required: true
                      description: ""
                      value: __VERSION__
                    accessed_date:
                      required: true
                      description: ""
                      value: "${YYYY-MM-DD}"
                    identifier:
                      required: true
                      description: ""
                      value:
                        type:
                          required: true
                          description: doi | ark | handle | url | local | other
                          type: dropdown
                          options: [doi, ark, handle, url, local, other]
                          value: __TYPE__
                        value:
                          required: true
                          description: Link to model card or documentation if available
                          value: __VALUE__
                    role:
                      required: false
                      description: " list from roles extending the CRediT taxonomy:
                        Conceptualization | Data_Curation | Formal_Analysis | Funding_Acquisition | Investigation | Methodology |
                        Project_Administration | Resources | Software | Supervision | Validation | Visualization | 
                        Writing_Original_Draft | Writing_Review_Editing | Data_Collection | Other"
                      type: dropdown
                      options: [Conceptualization, Data_Curation, Formal_Analysis, Funding_Acquisition, Investigation, Methodology,
                                Project_Administration, Resourcesm, Software, Supervision, Validation, Visualization,
                                Writing_Original_Draft, Writing_Review_Editing, Data_Collection, Other]
                      value:
                        __ROLE__
                    relationship:
                      required: false
                      description: "[discoverability_if_applicable, required for ai_model] select from:
                        used_to_create | used_to_process | used_to_analyze | recorded_by | trained_on | evaluated_on;
                        relationship of AI model to the  data card creation process. e.g., 'used_to_create' if the AI model
                        generated the initial draft of the data card, 'used_to_analyze' if the AI model analyzed dataset
                        metadata to populate the data card, 'evaluated_on' if the AI model was used to evaluate or validate the
                        data card content, or 'other' if none of the predefined relationships apply."
                      type: dropdown
                      options: [used_to_create, used_to_process, used_to_analyze, recorded_by, trained_on, evaluated_on, None]
                      value: __RELATIONSHIP__
                software:
                  required: false
                  conditional_context: "one_of_alternatives"
                  condition_discriminator: "agent_type"
                  description: "Required when agent_type is 'software'. Delete if using person, organization, or ai_model."
                  value:
                    name:
                      required: true
                      description: ""
                      value: "${SOFTWARE_NAME}"
                    version:
                      required: true
                      description: ""
                      value: __VERSION__
                    identifier:
                      required: true
                      description: ""
                      value:
                        type:
                          required: true
                          description: "doi | ark | handle | url | local | other"
                          type: dropdown
                          options: [doi, ark, handle, url, local, other]
                          value: __TYPE__
                        value:
                          required: true
                          description: ""
                          value: __VALUE__
                    role:
                      required: false
                      description: " list from roles extending the CRediT taxonomy:
                        Conceptualization | Data_Curation | Formal_Analysis | Funding_Acquisition | Investigation | Methodology |
                        Project_Administration | Resources | Software | Supervision | Validation | Visualization | Writing_Original_Draft |
                        Writing_Review_Editing | Data_Collection | Other"
                      type: dropdown
                      options: [Conceptualization, Data_Curation, Formal_Analysis, Funding_Acquisition, Investigation, Methodology,
                                Project_Administration, Resourcesm, Software, Supervision, Validation, Visualization,
                                Writing_Original_Draft, Writing_Review_Editing, Data_Collection, Other]
                      value:
                        __ROLE__
                    relationship:
                      required: false
                      description: "[discoverability_if_applicable, required for ai_model] select from: 
                        used_to_create | used_to_process | used_to_analyze | recorded_by | trained_on | evaluated_on; 
                        relationship of AI model to the  data card creation process. e.g., 'used_to_create' if the AI model 
                        generated the initial draft of the data card, 'used_to_analyze' if the AI model analyzed dataset 
                        metadata to populate the data card, 'evaluated_on' if the AI model was used to evaluate or validate the 
                        data card content, or 'other' if none of the predefined relationships apply."
                      type: dropdown
                      options: [used_to_create, used_to_process, used_to_analyze, recorded_by, trained_on, evaluated_on, None]
                      value: __RELATIONSHIP__
    identification:
      required: true
      description: " Key metadata fields that uniquely identify
        this dataset."
      value:
        name:
          required: true
          description: " Single human-readable name for
            this dataset. Use the same name in the data card filename. If this data
            card covers a collection, provide the collection name."
          value: "${DATASET_NAME}"
        project:
          required: true
          description: ' If the dataset is part of a Genesis
            project or sub-project, specify it here; otherwise, use "not_applicable".
            e.g., genesis | genesis-fusion | genesis-lightsource'
          value: "${PROJECT_NAME}"
        version:
          required: true
          description: " Dataset version using semantic
            versioning: MAJOR.MINOR.PATCH Increment MAJOR for breaking changes, MINOR
            for additions, PATCH for corrections. Start at 1.0 for first release.
            See supersedes / superseded_by below for linking versions, and stewardship.versioning_strategy
            for how versions are managed."
          value: '1.0'
        primary_id:
          required: true
          description: " Primary persistent identifier for
            this dataset. Aligns with dcterms:identifier and is the main identifier
            used in citations and references. Use ark or local if a DOI has not yet
            been assigned."
          value:
            type:
              required: true
              description: doi | ark | handle | url | osti | local | other | unregistered
              type: dropdown
              options: [doi, ark, handle, url, osti, local, other, unregistered]
              value: "${TYPE}"
            value:
              required: true
              description: "value of the primary identifier."
              value: __VALUE__
        additional_ids:
          required: false
          description: " Additional identifiers for
            this dataset. Aligns with adms:identifier and can include secondary identifiers,
            legacy identifiers, or identifiers for specific versions if primary_id
            is a collection-level identifier."
          value:
            type:
              required: false
              description: "doi | ark | handle | url | osti | sand | la-ur | local | other"
              type: dropdown
              options: [doi, ark, handle, url, osti, sand, local, la-ur, other]
              value: __TYPE__
            value:
              required: false
              description: " e.g., SAND2024-XXXXX | LAUR-XX-XXXXX"
              value: __VALUE__
        supersedes:
          required: false
          description: " Identifier of the prior version
            this dataset replaces. See stewardship.versioning_strategy for how versions
            are managed."
          value:
            type:
              required: false
              description: doi | ark | handle | url | local | other
              type: dropdown
              options: [doi, ark, handle, url, local, other]
              value: __TYPE__
            value:
              required: false
              description: "value of the identifier"
              value: __VALUE__
        superseded_by:
          required: false
          description: " Identifier of the newer version
            that replaces this dataset. Populate when this version is deprecated."
          value:
            type:
              required: false
              description: doi | ark | handle | url | local | other
              type: dropdown
              options: [doi, ark, handle, url, local, other]
              value: __TYPE__
            value:
              required: false
              description: "value of the identifier"
              value: __VALUE__
        parent_collection:
          required: false
          description: " Parent collection or experimental
            campaign this dataset belongs to. Use when this dataset is one of many
            in a larger organized collection or ensemble."
          value:
            name:
              required: false
              description: "name of the parent collection"
              value: __NAME__
            identifier:
              required: false
              description: ""
              value:
                type:
                  required: false
                  description: doi | ark | handle | url | local | other
                  type: dropdown
                  options: [doi, ark, handle, url, local, other]
                  value: __TYPE__
                value:
                  required: false
                  description: "value of the identifier"
                  value: __VALUE__
    dataset_description:
      required: true
      description: ""
      value:
        science_domain:
          required: false
          description: ' Extends the the list of OSTI
            Subject Areas with an Other category for datasets that do not fit into
            the OSTI list. Controlled vocabulary: "Biology and Medicine" | "Chemistry"
            | "Energy Storage, Conversion, and Utilization" | "Engineering" | "Environmental
            Sciences" | "Fission and Nuclear Technologies" | "Fossil Fuels" | "Geosciences"
            | "Materials" | "Mathematics and Computing" | "National Defense" | "Physics"
            | "Power Generation and Distribution" | "Renewable Energy" | "Other"'
          type: dropdown
          options: ["Biology and Medicine", "Chemistry", "Energy Storage, Conversion, and Utilization", "Engineering", 
                    "Environmental Sciences", "Fission and Nuclear Technologies", "Fossil Fuels", "Geosciences",
                    "Materials", "Mathematics and Computing", "National Defense", "Physics",
                    "Power Generation and Distribution", "Renewable Energy", "Other"]
          value: __DOMAIN__
