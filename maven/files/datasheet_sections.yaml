
# PRE-DATASHEET SECTION
- section_idx: 0
  title: Project Description
  description: 
  - App will automatically complete sections based on user inputs 
  - Include a title, descriptive title, contact persons, and a previously produced document (e.g., manuscript or LDRD report in pdf or docx format) with context information describing the data set, usage, etc.
  - If a document is not available (Question 7), complete Questions 8-10 with a verbose description of the project
  - The agent will parse the document (or verbose descriptions) and complete the datasheet sections. The user will be prompted to input additional clarification questions
  - Datasheet will produce a PDF to submit for ROSY review
  - Data transfer will require HPC account access
  - Do Not Include Restricted Information

  questions:
    - id: project_name
      label: Full Project Title
      caption: Title of project/application associated with the data
      height: 50

    - id: short_project_title
      label: Short Descriptive Title
      caption: A shorter, easy-to-reference name used for the data and metadata databases.
      height: 50

    - id: ald
      label: ALD and Division
      caption: Specify the ALD (Associate Laboratory Directorate) and Division
      height: 50

    - id: primary_contact
      label: Primary Contact Person
      caption: Person to contact about this collected metadata. Include name, email, and Z#
      height: 50

    - id: data_owner
      label: Data Owner
      caption: Owner of data (Can be same as Primary Contact Person). Include name, email, and Z#
      height: 50

    - id: classification
      label: Classification Level
      caption: Enter classification level Open (LA-UR), Open (Rosy), CUI, UCNI, Q-level-only
      height: 50
      type: button
      values:
      - Open, Public, Unrestricted
      - CUI Basic
      - CUI Specified
      - TPI Triad Proprietary

    - id: context_files
      label: Drop or upload files here to populate the datasheet.
      type: file_uploader
      intro: 
      - Upload context file(s) or manually fill out the three verbose fields.
      - Do Not Include Restricted Information
      height: 50
      required: false

    - id: project_description
      label: Provide Verbose Project Description
      caption: Include the project purpose, scientific context, creating team, sponsoring organization, funding source, facility or campaign context, and intended AI or analysis use.
      required: false
      height: 180

    - id: data_composition
      label: Provide Verbose Data Composition
      caption: Include what each record represents, approximate size, modalities or formats, labels or targets, preprocessing already performed, missing or redacted information, known errors or noise, external dependencies, and any license or restriction notes.
      required: false
      height: 180

    - id: project_url
      label: Provide relevant URLs and identifiers
      caption: "Manuscript DOI or URL, code repository, data repository, project page, documentation or tutorial links, and license or terms-of-use links. Prefix with labels like paper:, code:, data:, docs:, license: when possible."
      required: false
      height: 180

## DATASHEET SECTIONS START HERE
## DATASHEET SECTIONS START HERE

- section_idx: 1
  title: Datasheet Metadata
  description: 
  - The Agent has autofilled the datasheet. Please review all responses for accuracy and complete any required fields.

  questions:
    - id: s1.1
      label: "Dataset citation: (Include DOI or URL. Use information that matches data catalog entry)"

    - id: s1.2
      label: "Citation for this datasheet: (Leave blank for now. Eventually this should be a citable document)"
      required: false

    - id: s1.3
      label: Name and contact information of the cognizant data detective

    - id: s1.4
      label: Name and contact information for the cognizant data steward

    - id: s1.5
      label: Version of the Datasheet template
      caption: Complete at least one row to continue.
      type: table

      columns:
        - version
        - date
        - authors
        - changes

      min_full_rows: 1

- section_idx: 2
  title: Motivation

  questions:
    - id: s2.1
      label: "For what purpose was the dataset created? Was there a specific task in mind? Was there a specific gap that needed to be filled? Was the dataset created for or in the context of an AI application? Please provide a description."

    - id: s2.2
      label: "Who created the dataset (e.g., which team, research group) and on behalf of which entity (e.g., company, institution, organization)?"

    - id: s2.3
      label: "Who funded the creation of the dataset? If there is an associated grant, please provide the name of the grantor (e.g. federal agency and program office name) and the grant name and number (e.g. PAMS Award number and/or lab contract number). Provide the solicitation number and link."

    - id: s2.4
      label: "If the dataset was created at a scientific user facility, please include an identifier, title, or citation for the facility project or proposal under which the data were created."

    - id: s2.5
      label: "Was the dataset created as part of a larger initiative? If so, provide the name for the initiative."

    - id: s2.6
      label: Any other comments?
      required: false


- section_idx: 3
  title: Composition

  questions:
    - id: s3.1
      label: "What do the instances that comprise the dataset represent (e.g. documents, photos, people, countries)? Are there multiple types of instances (e.g., movies, users, and ratings; people and interactions between them; nodes and edges)? Please provide a description."

    - id: s3.2
      label: "How many instances are there in total (of each type, if appropriate)? For large datasets, approximate numbers are allowed."

    - id: s3.3
      label: "Does the dataset contain all possible instances or is it a sample (not necessarily random) of instances from a larger set? If the dataset is a sample, then what is the larger set? Is the sample representative of the larger set (e.g., geographic coverage)? If so, please describe how this representativeness was validated/verified. If it is not representative of the larger set, please describe why not (e.g., to cover a more diverse range of instances, because instances were withheld or unavailable)."

    - id: s3.4
      label: "What data does each instance consist of? “Raw” data (e.g., unprocessed text or images) or features? In either case, please provide a description."

    - id: s3.5
      label: "Is there a label or target associated with each instance? If so, please provide a description."

    - id: s3.6
      label: "Is any information missing from individual instances? If so, please provide a description, explaining why this information is missing (e.g., because it was unavailable). This does not include intentionally removed information, but might include, e.g., redacted text. If there is a version of the dataset with more information included (e.g., units, variable names, element types, ...) but for more restricted distribution, describe how that can be obtained."

    - id: s3.7
      label: "Are relationships between individual instances made explicit (e.g., users' movie ratings, social network links)? If so, please describe how these relationships are made explicit."

    - id: s3.8
      label: "Describe any measures of bias, skewness, imbalance, or other features and the results."

    - id: s3.9
      label: "Are there any known errors, sources of noise, or redundancies in the dataset? If so, please provide a description. These could be provided as validation assertions on individual items or descriptions that affect all entities."

    - id: s3.10
      label: "Is the dataset self-contained, or does it link to or otherwise rely on external resources (e.g., websites, tweets, other datasets)? If it links to or relies on external resources, a) are there guarantees that they will exist, and remain constant, over time; b) are there official archival versions of the complete dataset (i.e., including the external resources as they existed at the time the dataset was created); c) are there any restrictions (e.g., licenses, fees) associated with any of the external resources that might apply to a dataset consumer? Please provide descriptions of all external resources and any restrictions associated with them, as well as links or other access points, as appropriate."

    - id: s3.11
      label: "Has the dataset been reviewed for presence of material that might be considered confidential (e.g., data that is protected by legal privilege or by doctor-patient confidentiality, data that includes the content of individuals' non-public communications)? Does the dataset contain data for which access must be controlled? (e.g. proprietary information, pre-publication data) If so, please provide a description."

    - id: s3.12
      label: "Has the dataset been reviewed for presence of classified, proprietary, or export-controlled information? If so, please list the restrictions on distribution. Are there openly stated legal restrictions on combining this dataset with other public datasets (e.g., combining data sets that together allow access to health conditions of identifiable individuals)?"

    - id: s3.13
      label: "Does the dataset identify any subpopulations (e.g., by age, gender, career stage)? If so, please describe how these subpopulations are identified and provide a description of their respective distributions within the dataset. Were these distributions chosen to satisfy any requirements of the study?"
      required: false

    - id: s3.14
      label: "Is it possible to identify individuals (i.e., one or more natural persons), either directly or indirectly (i.e., in combination with other data) from the dataset? If so, please describe how."
      required: false

    - id: s3.15
      label: "Does the dataset contain data that might be considered sensitive in any way (e.g., data that reveals or contradicts deep-seated cultural beliefs about race or ethnic origins, deep ancestry, sexual orientations, religious beliefs, political opinions or union memberships, or locations; financial or health data; biometric or genetic data; forms of government identification, such as social security numbers; criminal history)? If so, please provide a description."
      required: false

    - id: s3.16
      label: Any other comments?
      required: false


- section_idx: 4
  title: Collection Process

  questions:
    - id: s4.1
      label: "How was the data associated with each instance acquired? Was the data directly observable (e.g., raw text, movie ratings), reported by subjects (e.g., survey responses), or indirectly inferred/derived from other data (e.g., part-of-speech tags, model-based guesses for age or language)? If the data was reported by subjects or indirectly inferred/derived from other data, was the data validated/verified? If so, please describe how. For simulation data, this includes what factors contributed to how the simulation parameters were chosen."

    - id: s4.2
      label: "What instruments or facilities were used to generate and collect the data? If the instruments have specific names or identifiers, please include them here. If multiple instruments were used over time, please indicate that here. If there are calibration properties of the instruments that are relevant to how the data is to be interpreted, they should be included in the dataset or described here. What mechanisms or procedures were used to collect the data (e.g., hardware apparatuses or sensors, manual human curation, software programs, software APIs)? How were these mechanisms or procedures validated?"

    - id: s4.3
      label: "How are data currently generated? How frequently is new data created? How does an individual / team get access to generate new data? What are the data rates?"

    - id: s4.4
      label: "How could the data generating facility be used to created specific data needed by the model teams? What would be the process and timeline?"

    - id: s4.5
      label: "If the dataset is a sample from a larger set, what was the sampling strategy (e.g., deterministic, probabilistic with specific sampling probabilities)? In some cases, a description of the sampling methodology may be appropriate."

    - id: s4.6
      label: "Who was involved in the data collection process (e.g., students, crowd workers, contractors) and how were they compensated (e.g., how much were crowd workers paid)?"

    - id: s4.7
      label: "Over what timeframe was the data collected? Does this timeframe match the creation timeframe of the data associated with the instances (e.g., recent crawl of old news articles)? If not, please describe the timeframe in which the data associated with the instances was created."

    - id: s4.8
      label: "Were any ethical review processes conducted (e.g., by an institutional review board)? If so, please provide a description of these review processes, including the outcomes, as well as a link or other access point to any supporting documentation."

    - id: s4.9
      label: "Were any other reviews for safety, cybersecurity, export control or other considerations conducted? If so, please provide a description of these review processes, including the outcomes."

    - id: s4.10
      label: "Did you collect the data from the individuals in question directly, or obtain it via third parties or other sources (e.g., websites)?"
      required: false

    - id: s4.11
      label: "Were the individuals in question notified about the data collection? If so, please describe (or show with screenshots or other information) how notice was provided, and provide a link or other access point to, or otherwise reproduce, the exact language of the notification itself."
      required: false

    - id: s4.12
      label: "Did the individuals in question consent to the collection and use of their data? If so, please describe (or show with screenshots or other information) how consent was requested and provided, and provide a link or other access point to, or otherwise reproduce, the exact language to which the individuals consented."
      required: false

    - id: s4.13
      label: "If consent was obtained, were the consenting individuals provided with a mechanism to revoke their consent in the future or for certain uses? If so, please provide a description, as well as a link or other access point to the mechanism (if appropriate)."
      required: false

    - id: s4.14
      label: "Has an analysis of the potential impact of the dataset and its use on data subjects (e.g., a data protection impact analysis) been conducted? If so, please provide a description of this analysis, including the outcomes, as well as a link or other access point to any supporting documentation."
      required: false

    - id: s4.15
      label: Any other comments?
      required: false

- section_idx: 5
  title: Preprocessing

  questions:
    - id: s5.1
      label: "Was any preprocessing/cleaning/labeling of the data done (e.g., discretization or bucketing, tokenization, part-of-speech tagging, SIFT feature extraction, removal of instances, processing of missing values)? If so, please provide a description. If not, you may skip the remaining questions in this section."

    - id: s5.2
      label: "Was the “raw” data saved in addition to the preprocessed/cleaned/labeled data (e.g., to support unanticipated future uses)? If so, please provide a link or other access point to the “raw” data."

    - id: s5.3
      label: "Is the software that was used to preprocess/clean/label the data available? If so, please provide a link or other access point."

    - id: s5.4
      label: "Is this dataset based on (extension of, extraction from, cleaned version of) another dataset? If so, how can the base dataset be accessed?"

    - id: s5.5
      label: Any other comments?
      required: false


- section_idx: 6
  title: Uses

  questions:
    - id: s6.1
      label: "Has the dataset been used for any tasks already? If so, please provide a description. Please highlight ways in which the data have been used for AI."

    - id: s6.2
      label: "Is there a repository that links to any or all papers or systems that use the dataset? If so, please provide a link or other access point."

    - id: s6.3
      label: "What (other) tasks could the dataset be used for? What are the limitations for such future use. Are there tasks for which the dataset should not be used? If so, please provide a description."

    - id: s6.4
      label: "Is there anything about the composition of the dataset or the way it was collected and preprocessed/cleaned/labeled that might impact future uses? For example, is there anything that a dataset consumer might need to know to avoid uses that could result in unfair treatment of individuals or groups (e.g., stereotyping, quality of service issues) or other risks or harms (e.g., legal risks, financial harms)? If so, please provide a description. Is there anything a dataset consumer could do to mitigate these risks or harms?"

    - id: s6.5
      label: "To what extent are the data AI-Ready? For example, have the data been used for training an AI model already? Not known / not tested? The formats are consistent with AI-readiness but the overall dataset is skewed or incomplete (e.g. missing negative results)."

    - id: s6.6
      label: "Are there tutorials or other supporting information to assist a user of these data? If so, please provide a description and identifier or link."

    - id: s6.7
      label: "Are there recommended ways to partition/sample the data (e.g., training, development/validation, testing) to make it more amenable to AI/statistical training? If so, please provide a description of these splits, explaining the rationale behind them. These could be description of algorithms or of balance requirements."

    - id: s6.8
      label: Any other comments?
      required: false


- section_idx: 7
  title: Distribution

  questions:
    - id: s7.1
      label: "Will the dataset be distributed to third parties outside of the entity (e.g., company, institution, organization) on behalf of which the dataset was created? If so, please provide a description."

    - id: s7.2
      label: "How will the dataset be distributed (e.g., tarball on website, API, GitHub)? Does the dataset have a digital object identifier (DOI)?"

    - id: s7.3
      label: "When will the dataset be distributed?"

    - id: s7.4
      label: "Will the dataset be distributed under a copyright or other intellectual property (IP) license, and/or under applicable terms of use (ToU)? If so, please describe this license and/or ToU, and provide a link or other access point to, or otherwise reproduce, any relevant licensing terms or ToU, as well as any fees associated with these restrictions. This includes any citation required of any analysis or product that uses this data. Do these licenses restrict possible licenses of derivative products."

    - id: s7.5
      label: "Have any third parties imposed IP-based or other restrictions on the data associated with the instances? If so, please describe these restrictions, and provide a link or other access point to, or otherwise reproduce, any relevant licensing terms, as well as any fees associated with these restrictions."

    - id: s7.6
      label: "Do any export controls or other regulatory restrictions apply to the dataset or to individual instances? If so, please describe these restrictions, and provide a link or other access point to, or otherwise reproduce, any supporting documentation. What is the classification or restriction level for the dataset or individual instances? E.g. Classified, Unclassified, Proprietary, CUI, ..."

    - id: s7.7
      label: "Is there a license associated with the dataset? If so, which one? What are the requirements for reuse?"

    - id: s7.8
      label: Any other comments?
      required: false


- section_idx: 8
  title: Maintenance

  questions:
    - id: s8.1
      label: "Who will be supporting/hosting/maintaining the dataset? Recommend describing by a persistent descriptor (program manager of a program) in addition to the current holder of that position."

    - id: s8.2
      label: "How can the owner/curator/manager of the dataset be contacted (e.g., email address)? Recommend using a persistent contact point that persists beyond an individual remaining in a particular employment position."

    - id: s8.3
      label: "Is there an erratum? If so, please provide a link or other access point."

    - id: s8.4
      label: "Will the dataset be updated (e.g., to correct labeling errors, add new instances, delete instances)? If so, please describe how often, by whom, and how updates will be communicated to dataset consumers (e.g., mailing list, GitHub)?"

    - id: s8.5
      label: "If the dataset relates to people, are there applicable limits on the retention of the data associated with the instances (e.g., were the individuals in question told that their data would be retained for a fixed period of time and then deleted)? If so, please describe these limits and explain how they will be enforced."

    - id: s8.6
      label: "Will older versions of the dataset continue to be supported/hosted/maintained? If so, please describe how. If not, please describe how its obsolescence will be communicated to dataset consumers."

    - id: s8.7
      label: "Is there a defined obsolescence of this data beyond which its utility is limited?"

    - id: s8.8
      label: "If others want to extend/augment/build on/contribute to the dataset, is there a mechanism for them to do so? If so, please provide a description. Will these contributions be validated/verified? If so, please describe how. If not, why not? Is there a process for communicating/ distributing these contributions to dataset consumers? If so, please provide a description."

    - id: s8.9
      label: Any other comments?
      required: false