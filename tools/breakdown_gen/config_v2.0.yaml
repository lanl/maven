# Breakdown generator config for Genesis datacard v2.0.0.
# Paths are relative to this file; "archive::member" reads a file inside a .tar.gz / .zip.
title: Genesis Data Card Breakdown Schema v2.0
output: genesis_dc_v2.0_breakdown.generated.yaml

template: inputs/data-cards-v2.0.0.zip::data-cards-v2.0.0/template/latest/template/genesis_datacard_merged_shared.yaml
# Template only, as the v1.2 breakdown was made: required, options and descriptions come from the template
# tags, placeholders and comments. Uncomment to let the LinkML schema decide them instead (decision A).
# schema: inputs/data-cards-v2.0.0.zip::data-cards-v2.0.0/datacard_schema/src/genesis_datacard/schema/genesis_datacard.yaml
guide: inputs/data-cards-v2.0.0.zip::data-cards-v2.0.0/template/latest/template/data_card_field_reference_guide_v2.0.0.md
root_class: GenesisDatacardClass

# v2.0 removed agent_type / type; the agent is identified by which sub-block is filled in.
# MAVEN's form needs a sibling discriminator, so one is synthesized (Q1 for Vedant: must MAVEN strip it on export?).
alternatives:
  blocks: [person, organization, ai_model, software]
  discriminator_keys: [agent_type, type]
  synthesize_as: agent_type
  required_keys: [given_name, family_name, name, version, affiliation, type, value]  # same convention as v1.2
  # 2026-10-30: each one-of block keeps the template definition and gets one sentence on how to choose.
  # It does not name agent_type: that key is not in the v2.0 template and is dropped on export.
  choice_hint:
    roles: {creator: the creator, contact: the contact, additional_contacts: this contact, authors: this author,
            contributors: this contributor, maintainer: the maintainer, reviewed_by: the reviewer}
    kinds: {person: a person, organization: an organization, ai_model: an AI model, software: a software tool}

extra_option: None
no_extra_option:
  - discoverability.datacard.creation_method
  # 2026-10-28: an existing option already means 'nothing' / best fit (Public, Draft, Data); None would only confuse
  - discoverability.datacard.sensitivity.overall_sensitivity
  - discoverability.sensitivity.overall_sensitivity
  - discoverability.release_status
  - accessibility.access_policy.access_level   # `Open` already means "no restriction"
  - governed_use.non_sensitivity_governance_metadata.rights_release_records.public_release_status   # Pending / Not_Approved cover "not released"

guide_for_top_level: false

# xCard has no supports_xCard key, which MAVEN's form requires (Q5 for Vedant). Left out until decided.
exclude_top_level: [xCard]

# Decisions recorded on 2026-10-19 (see MAVEN_overview.md section 8.4, D1-D3).
overrides:
  discoverability.identification.name: {required: true}            # D1: required by the schema, untagged in template
  discoverability.identification.primary_id.type: {required: true}  # D2: required block needs the ID type ('unregistered' exists)
  discoverability.identification.primary_id.value: {required: true} # D3: type and value go together; 'not_applicable' when unregistered
  discoverability.contact.person.email: {required: true}            # Vedant (2026-10-28): the primary contact needs an email
  # 2026-10-29: the comment calls this a controlled vocabulary but lists it after 'e.g.', so no dropdown is made
  interoperability.data_structure.features.data_type: {type: dropdown, options: [float, int, string, boolean, datetime, other]}
  interoperability.domain_metadata.fields.data_type: {type: dropdown, options: [float, int, string, boolean, datetime, other]}
  # 2026-10-29: 'Allowed values: Instrument' is a one-value list; a dropdown avoids typos (field stays optional)
  discoverability.dataset_type: {type: dropdown, options: [Instrument]}
  # 2026-10-30: same list as v1.2 (dropdown there), now written as 'such as samples, files, ..., other)'
  accessibility.dataset_scale.record_unit: {type: dropdown, options: [samples, files, records, timesteps, images, tokens, other]}
  # 2026-10-29: all four values describe a release request; datasets never submitted for public release need not_applicable
  governed_use.non_sensitivity_governance_metadata.rights_release_records.public_release_status: {options: [Approved, Pending, Not_Approved, Requires_STI_Review, not_applicable]}
