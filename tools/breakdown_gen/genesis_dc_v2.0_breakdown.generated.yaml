# Genesis Data Card Breakdown Schema v2.0
# GENERATED by tools/breakdown_gen/generate_breakdown.py; do not edit by hand.
# Change the config (overrides) and regenerate instead.
---
supports_discoverability:
  required: true
  description: ' "Yes" is required for all datacards to indicate whether the dataset described in
    the datacard is intended to be discoverable in catalogs and repositories. Does not
    necessarily indicate that the dataset is currently discoverable or that it meets all
    criteria for discoverability.'
  value: ${"Yes|No"}

supports_accessibility:
  required: true
  description: ' "Yes" | "No" - Indicates whether the dataset described in the datacard is intended
    to be shared or accessed by others, whether internally within a project or
    organization, with external collaborators, or publicly. Does not necessarily indicate
    that the dataset is currently accessible or that it meets all criteria for
    accessibility.'
  value: ${"Yes|No"}

supports_interoperability:
  required: true
  description: ' "Yes" | "No" - Indicates whether the dataset described in the datacard is intended
    to be interoperable, meaning it is intended to be integrated with other datasets or
    systems, or used in combination with other datasets. Does not necessarily indicate
    that the dataset is currently interoperable or that it meets all criteria for
    interoperability.'
  value: ${"Yes|No"}

supports_reusability:
  required: true
  description: ' "Yes" | "No" - Indicates whether the dataset described in the datacard is intended
    to be reusable, meaning it is intended to be reused by others for the same or
    different purposes. Does not necessarily indicate that the dataset is currently
    reusable or that it meets all criteria for reusability.'
  value: ${"Yes|No"}

supports_governed_use:
  required: true
  description: ' "Yes" | "No" - Indicates whether the dataset described in the datacard is intended
    to be shared or accessed under specific governance or oversight, such as datasets
    that are subject to security controls, export control, IRB oversight, or other types
    of formal review and approval processes. Does not necessarily indicate that the
    dataset is currently shared or accessed under specific governance or oversight, or
    that it meets all criteria for governed use.'
  value: ${"Yes|No"}

supports_ai_usability:
  required: true
  description: ' "Yes" | "No" - Indicates whether the dataset described in the datacard is intended
    to be used for AI training, evaluation, or other AI-related purposes. Does not
    necessarily indicate that the dataset is currently used for AI purposes or that it
    meets all criteria for AI usability.'
  value: ${"Yes|No"}

discoverability:
  required: true
  description: " Metadata fields that support the discoverability of the dataset, a key aspect of
    the FAIR principles and essential for enabling users to find the dataset in catalogs
    and repositories. These fields provide critical information that can enhance the
    data's discoverability and help users understand its relevance and suitability for
    their needs. The discoverability capability is required for all datacards to support
    basic findability in catalogs and repositories."
  value:
    datacard:
      required: true
      description: " Metadata about the datacard itself (not the dataset), including its
        sensitivity, creation method, and change log."
      value:
        template_version:
          required: true
          description: " Current version is 2.0.0; the version of the datacard template used to
            create this datacard."
          value: "2.0.0"
        datacard_version:
          required: true
          description: " Replace default value with the version of the datacard itself, which should
            be incremented when the datacard is meaningfully updated. Use semantic
            versioning: MAJOR.MINOR.PATCH e.g., 1.0 → 1.1 for content updates; 1.x -> 2.0
            for structural changes"
          value: "1.0.0"
        filename:
          required: true
          description: ' The filename of the data card document, follow naming convention:
            "genesis_datacard_${SNAKE_CASE_DATASET_NAME}$.md" where
            ${SNAKE_CASE_DATASET_NAME} is the dataset name in snake_case format. Use
            "genesis_datacard_other_${SNAKE_CASE_DATASET_NAME}$.md" for datasets that are
            not part of a Genesis project or sub-project.'
          value: "genesis_datacard_${SNAKE_CASE_DATASET_NAME}.md"
        language:
          required: true
          description: " Replace default value, 'en', with the language of the datacard content,
            following ISO 639-1 codes. e.g., en | es | fr | de | zh | ru | ar | pt | ja |
            ko"
          value: "en"
        id:
          required: false
          description: " A unique identifier for the datacard document itself, distinct from the
            dataset identifier. Assign if the datacard is registered in a catalog or
            repository independently of the dataset. If one of type or value is provided,
            the other must also be provided."
          value:
            type:
              required: false
              description: " The type of the identifier (e.g., DOI, UUID). Allowed values: ark | doi
                | handle | local | purl | url | urn | uuid | other | unregistered"
              type: dropdown
              options: [ark, doi, handle, local, purl, url, urn, uuid, other, unregistered]
              value: __TYPE__
            value:
              required: false
              description: " The value of the identifier, following the format specified by the
                'type' field."
              value: __VALUE__
        sensitivity:
          required: true
          description: " Sensitivity of the DATA CARD itself, which may differ from the sensitivity
            of the dataset it describes. Populate based on the sensitivity of the data
            card content alone, not the dataset. See NOTE ON SENSITIVITY above. NOTE:
