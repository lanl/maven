          value: __VERSIONING_STRATEGY__
    data_quality:
      required: true
      description: " Provides information about the quality of the dataset, including any known
        issues, limitations, or uncertainties that may affect its suitability for AI/ML
        applications."
      value:
        completeness:
          required: true
          description: " Information about the completeness of the dataset, including any known
            gaps, missing values, or limitations in the data that may affect its
            suitability for use. e.g., All detector channels present; 2% of timesteps
            missing | Missing due to sensor downtime for 5% of samples | Dataset is
            complete with no known gaps or missing values | not_applicable"
          value: ${COMPLETENESS}
        known_issues:
          required: true
          description: ' Any known issues or limitations with the dataset that may affect its
            suitability for use. Be explicit if there are no known issues or limitations
            (e.g., "not_applicable") rather than leaving this field blank. e.g., Sensor
            drift observed after 2023-06-01T12:00:00Z | Sensor calibration drift affects
            accuracy of measurements after June 2023 | Data from Facility X may have
            quality issues due to known equipment problems during the data collection
            period | not_applicable'
          value: ${KNOWN_ISSUES}
        validation_methods:
          required: true
          description: ' Information about any validation methods or processes that have been
            applied to the dataset to assess its quality and suitability for use. Be
            explicit if there are no validation methods or processes (e.g.,
            "not_applicable") rather than leaving this field blank. e.g., Cross-validated
            against NIST SRM 640f | Dataset validated against ground truth measurements
            from Facility Y | Data quality assessed using method Z with the following
            results: ... | not_applicable'
          value: ${VALIDATION_METHODS}
        noise_characteristics:
          required: false
          description: ' Information about the noise characteristics of the dataset. Be explicit if
            there are no known noise issues or characteristics (e.g., "not_applicable")
            rather than leaving this field blank. e.g., Signal-to-noise ratio (SNR) of 20
            dB across all channels | Noise level increases by 5% after June 2023 due to
            equipment degradation | Dataset has low noise levels with no known issues |
            not_applicable'
          value: __NOISE_CHARACTERISTICS__
        uncertainty_notes:
          required: false
          description: ' Any known uncertainties or limitations in the dataset that may affect its
            suitability for use. Be explicit if there are no known uncertainties or
            limitations (e.g., "not_applicable") rather than leaving this field blank.
            e.g., Measurement uncertainty ±0.5% (k=2) per ISO/IEC Guide 98-3 |
            Uncertainty increases to ±10% for measurements taken after June 2023 due to
            equipment degradation | Dataset has low uncertainty with no known issues |
            not_applicable'
          value: __UNCERTAINTY_NOTES__
        missing_data_codes:
          required: false
          description: " If the dataset contains missing values, list the missing codes and their
