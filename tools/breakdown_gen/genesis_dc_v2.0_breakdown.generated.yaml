ai_usability:
  description: Metadata fields that support the AI usability of the dataset, These fields provide critical information about the allowed ai use for AI purposes, as well as any restrictions, biases, risks, safety considerations, and other factors related to using the dataset for AI purposes. The ai_usability capability is required for datacards of datasets that are intended to be used for AI training, evaluation, or other AI-related purposes.
  visible: true
  value:
    ai_usage:
      description: Describes whether and how this dataset may be used in AI/ML workflows. Be explicit — these fields are read by automated pipeline tooling. This can provide important information about the suitability of the dataset for AI/ML applications and can inform users about any specific considerations or restrictions related to using the dataset in AI/ML workflows.
      visible: true
      value:
        training_use_status:
          description: 'The status of whether this dataset can be used for training in AI/ML workflows. Allowed values: "Yes" | "No" | Conditional'
          visible: true
          mapping: null
          type: dropdown
          options: ['Yes', 'No', Conditional]
          length: null
          required: true
          value: ''
        training_use_conditions:
          description: If training_use_status is "Conditional", this field is required and describes the specific conditions or restrictions that must be met for the dataset to be used for training AI models. This can provide users with important information about any limitations or considerations they should be aware of when using the dataset for training AI models.
          visible: true
          mapping: null
          type: string
          options: null
          length: null
          required: false
          value: ''
        inference_use_status:
          description: 'The status of whether this dataset can be used for inference in AI/ML workflows. Allowed values: "Yes" | "No" | Conditional'
          visible: true
          mapping: null
          type: dropdown
          options: ['Yes', 'No', Conditional]
          length: null
          required: true
          value: ''
        inference_use_conditions:
          description: If inference_use_status is "Conditional", this field is required and describes the specific conditions or restrictions that must be met for the dataset to be used for inference with AI models. This can provide users with important information about any limitations or considerations they should be aware of when using the dataset for inference with AI models.
          visible: true
          mapping: null
          type: string
          options: null
          length: null
          required: false
          value: ''
        evaluation_use_status:
          description: 'The status of whether this dataset can be used for evaluation in AI/ML workflows. Allowed values: "Yes" | "No" | Conditional'
          visible: true
          mapping: null
          type: dropdown
          options: ['Yes', 'No', Conditional]
          length: null
          required: true
          value: ''
