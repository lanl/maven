accessibility:
  description: Metadata fields that support the accessibility of the dataset. These fields provide critical information about how to access the dataset, including any restrictions or requirements for access. The accessibility capability is required for datacards of datasets that are intended to be shared or accessed by others, whether internally within a project or organization, with external collaborators, or publicly.
  visible: true
  value:
    access_policy:
      description: Describes who can access this dataset and under what conditions. access_policy.access_level describes the dataset's access sensitivity — the same subject as sensitivity.overall_sensitivity. Reproduced here for access control systems that evaluate this block independently. See NOTE ON SENSITIVITY TIERS above.
      visible: true
      value:
        access_level:
          description: 'The access level of the dataset. This provides important context about who can access the dataset and can inform users about potential barriers to access and use. This does not replace the authoritative source markings and metadata fields for classification, CUI, or other sensitivity designations, which should still be filled out based on the authoritative source markings. Allowed values: Open | Restricted | Controlled'
          visible: true
          mapping: null
          type: dropdown
          options: [Open, Restricted, Controlled]
          length: null
          required: true
          value: ''
        access_restrictions:
          description: Freetext description of any specific access restrictions or requirements for the dataset, beyond what is indicated by the classification and sensitivity markings. This can provide more detailed information about who is allowed to access the dataset and under what conditions, which can inform users about potential barriers to access and use. e.g., Requires signed DUA | None - publicly accessible | Access limited to cleared personnel with need-to-know | Requires two-factor authentication and secure VPN access
          visible: true
          mapping: null
          type: string
          options: null
          length: null
          required: false
          value: ''
        authorization_required:
          description: 'List of authorizations required. When formal authorization is required to access the datase. Allowed values: Account | User_Agreement | Data_Use_Agreement | Sponsor_Approval | Export_Control_Review | IRB_Approval | Other'
          visible: true
          mapping: null
          type: dropdown
          options: [Account, User_Agreement, Data_Use_Agreement, Sponsor_Approval, Export_Control_Review, IRB_Approval, Other]
          length: null
          required: false
          value: ''
        intended_partner_classes:
          description: 'The intended partner classes/types (list) that are expected to access and use this dataset, if applicable. If absent, or null, this field is not yet known or determined. Use an empty list if definitively no specific partner classes are targeted. Use Public if this dataset is intended for broad public use without restrictions. Allowed values: Internal_Team | Tri_Lab | DOE_NNSA_Lab | Federal_Partner | Contractor | Academic_Researchers | External_Research_Partner | Industry_Partner | Public | Other'
          visible: true
          mapping: null
          type: dropdown
          options: [Internal_Team, Tri_Lab, DOE_NNSA_Lab, Federal_Partner, Contractor, Academic_Researchers, External_Research_Partner, Industry_Partner, Public, Other]
          length: null
          required: false
          value: ''
        approved_environments:
          description: 'Approved environments for accessing or using the dataset, if applicable. Use an empty list ([]) if there are no specific approved environments or if the dataset is publicly accessible. null or absent means it has not yet been determined whether approved environments are required. This can inform users about where they are allowed to access and use the dataset, which can be important for compliance with security requirements. Allowed values: JUCE | Classified Enclave | CUI Approved Enclave | Cloud Enclave (Authorized)'
