reusability:
  required: true
  description: " Metadata fields that support the reusability of the dataset, and enables users to
    reuse the dataset for the same or different purposes. These fields provide critical
    information about the authorship, license, stewardship, and data quality of the
    dataset. The reusability capability is required for datacards of datasets that are
    intended to be reusable."
  value:
    license:
      required: false
      description: " Block to capture a license under which the dataset is released. This indicates
        the legal permissions and restrictions associated with using the dataset and can
        inform users about how they are allowed to use, share, and build upon the data. A
        public/open license is not always the governing instrument for use, some
        controlled datasets may not have an SPDX-style reuse license at all, and use may
        instead be governed by contract, agreement, institutional review, or repository
        policy."
      value:
        spdx_id:
          required: false
          description: ' The SPDX license identifier for the dataset, use the SPDX license
            identifier: https://spdx.org/licenses/ Use "Other" if not in SPDX registry.
            Use "Pending" if not yet assigned. This provides a standardized way to
            indicate the license for the dataset and can inform users about the legal
            permissions and restrictions associated with using the data. e.g., CC-BY-4.0
            | CC0-1.0 | Apache-2.0 | MIT | Other | Pending'
          value: __SPDX_ID__
        name:
          required: false
          description: " The human-readable name of the license."
          value: __NAME__
        url:
          required: false
          description: " URL to a license. This can provide users with direct access to the full
            terms and conditions, which can inform their understanding of legal and
            ethical requirements."
          value: __URL__
        known_contractual_rights:
          required: false
          description: " Any known contractual rights or obligations associated with this dataset
            that may not be fully captured by the license or access policy information.
            This can include information about data sharing agreements, third-party
            restrictions, or other legal considerations that users should be aware of
            when working with the dataset. DOE/NNSA datasets may have complex contractual
            arrangements that impact how the data can be used and shared beyond license
            terms. e.g., Government has unlimited rights | Contractor retains rights with
            government license"
          value: __KNOWN_CONTRACTUAL_RIGHTS__
    additional_licenses:
      required: false
      description: " Additional licenses governing this dataset, if multiple licenses apply. This
        can provide users with a more complete understanding of the legal permissions and
        restrictions associated with using the dataset, especially in cases where
        different parts of the dataset may be subject to different licenses."
      value:
