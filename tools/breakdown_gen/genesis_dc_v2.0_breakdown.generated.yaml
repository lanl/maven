    sensitivity:
      description: 'Sensitivity of the DATASET and of the DATA CARD: the data card''s sensitivity (discoverability.datacard.sensitivity) is filled from these values. NOTE: Sensitivity terminology is still under Genesis governance review. Vocabulary may evolve.'
      visible: true
      value:
        overall_sensitivity:
          description: 'Human-readable top-level sensitivity posture of the data card (for `discoverability.datacard.sensitivity`), or the dataset (for `discoverability.sensitivity`) - do not automatically set the overall sensitivity of the data card and dataset sensitivity to the same value, as they may differ. The field value is based on the authoritative source markings and metadata fields. This is a summary field only and does not replace the authoritative fields such as the classification_status, classification_level, export_control_basis, or privacy_control_basis fields. Authoritative source markings and metadata fields should be used for access control and governance decisions. Use "Public" for unclassified, non-sensitive assets that can be shared publicly. Allowed values: Public | Unclassified_Uncontrolled | CUI | UCNI | Classified | Legacy_Controlled | Mixed | Other_Controlled'
