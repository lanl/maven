      description: " Stewardship & Versioning metadata to capture information about dataset
        maintenance, updates, versioning, and reviews. This can provide users with
        important information about how the dataset is maintained and updated over time.
        NOTE ON VERSIONING: Three fields work together to describe versioning:
        discoverability.identification.version — the version number of this dataset;
        discoverability.identification.supersedes /
        discoverability.identification.superseded_by — links to prior and successor
