    sensitivity:
      required: true
      description: " Sensitivity of the DATASET, which may differ from the sensitivity of the data
        card. Populate based on the sensitivity of the dataset alone, not the data card.
        See NOTE ON SENSITIVITY above. NOTE: Sensitivity terminology is still under
        Genesis governance review. Vocabulary may evolve."
      value:
        overall_sensitivity:
          required: true
          description: ' Human-readable top-level sensitivity posture of the data card (for
            `discoverability.datacard.sensitivity`), or the dataset (for
            `discoverability.sensitivity`) - do not automatically set the overall
            sensitivity of the data card and dataset sensitivity to the same value, as
            they may differ. The field value is based on the authoritative source
            markings and metadata fields. This is a summary field only and does not
            replace the authoritative fields such as the classification_status,
            classification_level, export_control_basis, or privacy_control_basis fields.
            Authoritative source markings and metadata fields should be used for access
            control and governance decisions. Use "Public" for unclassified,
            non-sensitive assets that can be shared publicly. Allowed values: Public |
            Unclassified_Uncontrolled | CUI | UCNI | Classified | Legacy_Controlled |
            Mixed | Other_Controlled'
          type: dropdown
          options: [Public, Unclassified_Uncontrolled, CUI, UCNI, Classified, Legacy_Controlled, Mixed, Other_Controlled]
          value: ${OVERALL_SENSITIVITY}
        source_marking_string:
          required: true
          description: ' Exact marking/banner/control text as it appears on the source artifact or
            in the authoritative review/release output, if applicable. The artifact is
            either the data card (for `discoverability.datacard.sensitivity`), or the
            dataset (for `discoverability.sensitivity`). Provides the authoritative
            source marking information for the asset, which is critical for ensuring
            proper handling and access controls based on the sensitivity of the asset. If
            no source markings apply to the asset, this field should be filled with
            "not_applicable". If the asset has multiple source markings, list them
            separated by // with no spaces. This field does not replace the individual
            metadata fields for classification status, classification level, export
            control basis, or privacy control basis, which should still be filled out
            based on the authoritative source markings. e.g., not_applicable |
            CUI//SP-EXPT//NOFORN | SECRET//RD//SIGMA 15 | OFFICIAL USE ONLY'
          value: ${SOURCE_MARKING_STRING}
        source_marking_scheme:
          required: true
          description: ' Identifies the authoritative source marking regime, for the
            source_marking_string field. Use "None" for unclassified, non-sensitive
            assets that can be shared publicly. If a Legacy_OUO is unresolved to a
            current standard marking, the `normalized_control_basis` should be populated
            as "Legacy_Needs_Mapping" to indicate that the control basis is legacy and
            needs interpretation for governance purposes. Allowed values: DOE_CUI |
            DOE_UCNI | EO13526_Classified | AEA_RD_FRD_TFNI | DOD_CUI | DHS_CUI |
            Legacy_OUO | Legacy_Site_Specific | Other_Agency | None'
          type: dropdown
          options: [DOE_CUI, DOE_UCNI, EO13526_Classified, AEA_RD_FRD_TFNI, DOD_CUI, DHS_CUI, Legacy_OUO, Legacy_Site_Specific, Other_Agency, None]
          value: ${SOURCE_MARKING_SCHEME}
        classified_status:
          required: true
          description: " Indicates whether the asset is classified."
          type: radio
          options: ["Yes", "No"]
          value: ${"Yes|No"}
        classification_level:
          required: false
          description: ' Official classification level, if the asset is classified. Required if
            classified_status is "Yes". Allowed values: Top_Secret | Secret |
            Confidential'
          type: dropdown
          options: [Top_Secret, Secret, Confidential]
          value: __CLASSIFICATION_LEVEL__
        classification_category:
          required: false
          description: ' Official classification category, if the asset is classified. Required if
            classified_status = "Yes". If present, at least one specified category must
            be included. Allowed values: NSI | RD | FRD | TFNI | Other_Classified'
          type: dropdown
          options: [NSI, RD, FRD, TFNI, Other_Classified]
          value: []
        classified_control_markings:
          required: false
          description: " Additional classified dissemination/caveat/handling markings appearing with
            classified content. List all that apply, each as a separate entry. This
            provides important context for handling and access controls for classified
            assets. e.g., NOFORN | CNWDI | SIGMA 15 | ORCON | REL TO USA, GBR"
          value: []
        cui_status:
          required: true
          description: " Indicates whether the asset is Controlled Unclassified Information (CUI)."
          type: radio
          options: ["Yes", "No"]
          value: ${"Yes|No"}
        cui_basic_categories:
          required: false
          description: " Basic CUI categories applicable to this asset, if it is CUI. Use the
            DOE/ISOO-authoritative CUI Basic categories or subcategories. List all that
            apply, each as a separate entry. This provides important context for handling
            and access controls for CUI assets."
          value: []
        cui_specified_categories:
          required: false
          description: ' Specified CUI categories applicable to this asset, if it is CUI. At least
            one specified category is required if cui_status = "Yes" or ucni_status =
            "Yes". If present, at least one specified category must be included. Use the
            DOE/ISOO-authoritative CUI Specified categories or subcategories. List all
            that apply, each as a separate entry. This provides important context for
            handling and access controls for CUI assets.'
          value: []
        cui_limited_dissemination_controls:
          required: false
          description: " Applicable CUI limited dissemination controls. Ordering/formatting should
            follow authoritative agency guidance. If cui_limited_dissemination_controls
            contains NOFORN, REL TO..., DISPLAY ONLY..., or similar controls, then
            governed_use.non_sensitivity_governance_metadata.foreign_national_access_status
            should be consistent with those controls. e.g., NOFORN | REL TO USA, GBR |
            DISPLAY ONLY USA, GBR | RELIDO | [other authoritative values.]"
          value: []
        ucni_status:
          required: true
          description: " Indicates whether the asset contains UCNI. UCNI is represented separately
            and should not be treated as an ordinary CUI category value. This provides
            important context for handling and access controls for UCNI assets."
          type: radio
          options: ["Yes", "No"]
          value: ${"Yes|No"}
        uk_mda_status:
          required: false
          description: ' Indicates whether the asset is subject to UK Ministry of Defence Assessment
            (MDA)-specific handling. Optional and may be used where relevant to
            local/site governance. Allowed values: "Yes" | "No" | Unknown |
            not_applicable'
          type: dropdown
          options: ["Yes", "No", Unknown, not_applicable]
          value: __UK_MDA_STATUS__
        legacy_label_source:
          required: false
          description: " Preserves deprecated or local historical control labels such as OUO, SBU,
            or site-specific legacy markings as provenance/source information only. If
            source_marking_scheme = Legacy_OUO, legacy_label_source should be populated
            with the corresponding legacy OUO labels. Provide as a list of unique entries
            if multiple legacy labels apply. e.g., OUO | SBU | Legacy_Site_Marking"
          value: []
        normalized_control_basis:
          required: false
          description: ' Optional interpreted control basis used for governance where source
            materials contain legacy, mixed, or non-standard constructs. If present, it
            must be populated with at least one value. Provide as a list of unique
            entries if multiple control bases apply. This does not replace authoritative
            source markings. If source_marking_scheme = Legacy_OUO and the legacy marking
            is unresolved to a current standard marking, this should be populated as
            "Legacy_Needs_Mapping" to indicate that the control basis is legacy and needs
            interpretation for governance purposes. Allowed values: Classified | CUI |
            UCNI | Public_Release_Approved | Legacy_Needs_Mapping | Other_Controlled'
          type: dropdown
          options: [Classified, CUI, UCNI, Public_Release_Approved, Legacy_Needs_Mapping, Other_Controlled]
          value: []
    workflow:
      required: true
      description: " Describes the technical and processing lifecycle position of the dataset.
        discoverability.workflow.state — describes the technical/processing lifecycle
        position of the data itself (raw → archived) reusability.release_status —
        describes the publication and governance state of the dataset record (draft →
        deprecated) These should be logically consistent. Common alignments:
        discoverability.workflow.state=Raw|Processing|QA|Analysis →
        reusability.release_status=Draft discoverability.workflow.state=Review →
        reusability.release_status=Under_Review
        discoverability.workflow.state=Embargo|Published →
        reusability.release_status=Approved|Published
        discoverability.workflow.state=Archived →
        reusability.release_status=Deprecated|Published"
      value:
        state:
          required: true
          description: " Current lifecycle position of the data itself, following StateEnum
            controlled vocabulary. Allowed values: Raw | Processing | QA | Analysis |
            Review | Embargo | Published | Archived | not_applicable"
          type: dropdown
          options: [Raw, Processing, QA, Analysis, Review, Embargo, Published, Archived, not_applicable]
          value: ${STATE}
        is_intermediate:
          required: false
          description: ' Whether this dataset is an intermediate output, as opposed to a final
            deliverable. "No" if this is final.'
          type: radio
          options: ["Yes", "No"]
          value: __"Yes|No"__
        pipeline_stage:
          required: false
          description: " Freetext position in processing pipeline. e.g., raw telemetry,
            pre-calibration | post-detector, pre-reconstruction | post-reconstruction,
            pre-analysis"
          value: __PIPELINE_STAGE__
        embargo_until:
          required: false
          description: " Required if state=Embargo. ISO 8601 date after which release is permitted."
          value: "__YYYY-MM-DD__"

accessibility:
  required: true
  description: " Metadata fields that support the accessibility of the dataset. These fields provide
    critical information about how to access the dataset, including any restrictions or
    requirements for access. The accessibility capability is required for datacards of
    datasets that are intended to be shared or accessed by others, whether internally
    within a project or organization, with external collaborators, or publicly."
  value:
    access_policy:
      required: true
      description: " Describes who can access this dataset and under what conditions.
        access_policy.access_level describes the dataset's access sensitivity — the same
        subject as sensitivity.overall_sensitivity. Reproduced here for access control
        systems that evaluate this block independently. See NOTE ON SENSITIVITY TIERS
        above."
      value:
        access_level:
          required: true
          description: " The access level of the dataset. This provides important context about who
            can access the dataset and can inform users about potential barriers to
            access and use. This does not replace the authoritative source markings and
            metadata fields for classification, CUI, or other sensitivity designations,
            which should still be filled out based on the authoritative source markings.
            Allowed values: Open | Restricted | Controlled"
          type: dropdown
          options: [Open, Restricted, Controlled]
          value: ${ACCESS_LEVEL}
        access_restrictions:
          required: false
          description: " Freetext description of any specific access restrictions or requirements
            for the dataset, beyond what is indicated by the classification and
            sensitivity markings. This can provide more detailed information about who is
            allowed to access the dataset and under what conditions, which can inform
            users about potential barriers to access and use. e.g., Requires signed DUA |
            None - publicly accessible | Access limited to cleared personnel with
            need-to-know | Requires two-factor authentication and secure VPN access"
          value: __ACCESS_RESTRICTIONS__
        authorization_required:
          required: false
          description: " List of authorizations required. When formal authorization is required to
            access the datase. Allowed values: Account | User_Agreement |
            Data_Use_Agreement | Sponsor_Approval | Export_Control_Review | IRB_Approval
            | Other"
          type: dropdown
          options: [Account, User_Agreement, Data_Use_Agreement, Sponsor_Approval, Export_Control_Review, IRB_Approval, Other]
          value: []
        intended_partner_classes:
          required: false
          description: " The intended partner classes/types (list) that are expected to access and
            use this dataset, if applicable. If absent, or null, this field is not yet
            known or determined. Use an empty list if definitively no specific partner
            classes are targeted. Use Public if this dataset is intended for broad public
            use without restrictions. Allowed values: Internal_Team | Tri_Lab |
            DOE_NNSA_Lab | Federal_Partner | Contractor | Academic_Researchers |
            External_Research_Partner | Industry_Partner | Public | Other"
          type: dropdown
          options: [Internal_Team, Tri_Lab, DOE_NNSA_Lab, Federal_Partner, Contractor, Academic_Researchers, External_Research_Partner, Industry_Partner, Public, Other]
          value: []
        approved_environments:
          required: false
          description: " Approved environments for accessing or using the dataset, if applicable.
            Use an empty list ([]) if there are no specific approved environments or if
            the dataset is publicly accessible. null or absent means it has not yet been
            determined whether approved environments are required. This can inform users
            about where they are allowed to access and use the dataset, which can be
            important for compliance with security requirements. Allowed values: JUCE |
            Classified Enclave | CUI Approved Enclave | Cloud Enclave (Authorized)"
          type: dropdown
          options: [JUCE, "Classified Enclave", "CUI Approved Enclave", "Cloud Enclave (Authorized)"]
          value: []
        policy_url:
          required: false
          description: " URL to the official access policy or data use agreement governing this
            dataset. This can provide users with direct access to the full terms and
            conditions for using the dataset, which can inform their understanding of
            legal and ethical requirements."
          value: __POLICY_URL__
        policy_text:
          required: false
          description: " Inline summary if no policy_url exists. This can provide users with a quick
            overview of the key terms and conditions for using the dataset, which can
            inform their understanding of legal and ethical requirements."
          value: __POLICY_TEXT__
    access:
      required: true
      description: " Access Endpoints information. This can include the current
        location/landingpage, and intended repository information, such as access
        instructions and APIs. Intended to provide information on how to access the
        dataset for humans and machines."
      value:
        current_location:
          required: true
          description: " Where the data physically resides right now. Use for in-workflow data not
            yet deposited in a repository, or for any dataset with a known internal or
            external storage path. e.g., /mnt/ecs/scientific-data/project/dataset/ |
            /lustre/orion/proj-shared/dataset/ | s3://genesis-bucket/dataset/"
          value: ${CURRENT_LOCATION}
        publicly_facing_landing_page_url:
          required: false
          description: " A publicly facing URL that provides information about the dataset and how
            to access it. It may differ from the current_location if the dataset is not
            yet publicly released or if the current_location is an internal storage path.
            This can provide users with a direct point of access for learning more about
            the dataset and how to obtain it."
          value: __PUBLICLY_FACING_LANDING_PAGE_URL__
        intended_repositories:
          required: false
          description: " Repositories you intend to deposit or have deposited this dataset in. The
            managing repository or catalog system will resolve and populate
            repository-assigned fields at ingest (see repository_managed slot).
            Repositories may be institutional, project-owned, community, or national
            (e.g., Zenodo, institutional data repository, project data store)."
          value:
            name:
              required: false
              description: " Human-readable name or local string key for the entity."
              value: ${NAME}
            access_level:
              required: false
              description: " The access level of the dataset. This provides important context about
                who can access the dataset and can inform users about potential barriers
                to access and use. This does not replace the authoritative source
                markings and metadata fields for classification, CUI, or other
                sensitivity designations, which should still be filled out based on the
                authoritative source markings. Allowed values: Open | Restricted |
                Controlled"
              type: dropdown
              options: [Open, Restricted, Controlled]
              value: ${ACCESS_LEVEL}
            is_primary:
              required: false
              description: " Whether this is the primary or authoritative location for the dataset.
                Only one IntendedRepository should be marked as primary. This can help
                users identify the most reliable or official source for accessing the
                dataset, especially if there are multiple access points or repositories
                where the data is available."
              type: radio
              options: ["Yes", "No"]
              value: __"Yes|No"__
            date_deposited:
              required: false
              description: " The date when the dataset was deposited in the repository, in ISO 8601
                format (YYYY-MM-DD). Can inform users about the currency of the data."
              value: __DATE_DEPOSITED__
            data_services:
              required: false
              description: " APIs available for accessing the dataset, if any. This can provide
                users with information about programmatic access options for the dataset,
                which can facilitate integration into workflows."
              value:
                name:
                  required: false
                  description: " The name of the data service or API endpoint. e.g., REST API |
                    GraphQL endpoint"
                  value: ${NAME}
                endpoint:
                  required: false
                  description: " The URL or connection string for an API endpoint that provides
                    access to the dataset. Provide users with direct access to
                    programmatic interfaces for working with the dataset. Useful for
                    enabling machine-actionable data documentation."
                  value: __ENDPOINT__
                documentation_url:
                  required: false
                  description: " URL to documentation for the API or access method. This can provide
                    users with important information about how to use the API or access
                    method effectively, which can facilitate integration into AI/ML
                    workflows and other data processing pipelines. Useful for enabling
                    machine-actionable data documentation."
                  value: __DOCUMENTATION_URL__
                authentication:
                  required: false
                  description: " Whether authentication is required to access the dataset through
                    this endpoint. Informs users about potential barriers to access and
                    can help them prepare \\ for any necessary credentials or permissions
                    needed to work with the dataset. Allowed values: None | API_Key |
                    OAuth2 | SAML | Certificate | OpenID_Connect | Basic_Auth |
                    Bearer_Token | Other"
                  type: dropdown
                  options: [None, API_Key, OAuth2, SAML, Certificate, OpenID_Connect, Basic_Auth, Bearer_Token, Other]
                  value: __AUTHENTICATION__
                version:
                  required: false
                  description: " Version of software, tool, or library."
                  value: __VERSION__
                rate_limit:
                  required: false
                  description: " Any rate limits or access restrictions for the API endpoint.
                    Informs users about potential limitations on how frequently they can
                    access the dataset through the API, which can help them plan their
                    data processing and analysis workflows accordingly. e.g., 1000
                    requests/hour | 5000 requests/day | 1000 requests/hour and no more
                    than 100 concurrent connections"
                  value: __RATE_LIMIT__
    dataset_scale:
      required: false
      description: " These fields describe the scale of the dataset, w hich is important for users
        to understand the scope and potential resource requirements for using the
        dataset."
      value:
        record_count:
          required: false
          description: " The number of records or rows in the dataset."
          value: __RECORD_COUNT__
        record_unit:
          required: false
          description: " The unit of measurement for the record count, such as samples, files,
            records, timesteps, images, tokens, other)."
          type: dropdown
          options: [samples, files, records, timesteps, images, tokens, other]
          value: __RECORD_UNIT__
        compressed_bytes:
          required: false
          description: " The size of the dataset in bytes when compressed."
          value: __COMPRESSED_BYTES__
        uncompressed_bytes:
          required: false
          description: " The size of the dataset in bytes when uncompressed."
          value: __UNCOMPRESSED_BYTES__

interoperability:
  required: true
  description: " These fields are intended to enable users to integrate the dataset with other
    datasets or systems, or use it in combination with other datasets. These fields
    provide critical information about the meaning, data representation and structure,
    provenance, related resources and integrity of the dataset."
  value:
    data_structure:
      required: true
      description: " Fields describing the format, encoding, and structure of the dataset."
      value:
        formats:
          required: true
          description: " File formats included in this dataset. e.g., csv | json | parquet | hdf5 |
            netcdf | jpeg | png | tiff | wav | mp3 | mp4 | avi | application/octet-stream
            | binary"
          value: []
        encoding:
          required: false
          description: " Character encoding for text-based formats. UTF-8 strongly recommended. Use
            not_applicable for binary formats. e.g., UTF-8 | ASCII | Latin-1 |
            not_applicable"
          value: __ENCODING__
        schema_version:
          required: false
          description: " Version of the data schema used in this dataset. Distinct from
            datacard_version. Increment when the data schema changes, even if the
            datacard version remains the same."
          value: __SCHEMA_VERSION__
        modalities:
          required: true
          description: " Data modalities present. e.g., tabular | image | time-series | text | graph
            | point-cloud"
          value: []
        features:
          required: true
          description: ' Primary variables, fields, or features. IMPORTANT: choose ONE form and use
            it consistently — do not mix. For basic discoverability — flat string list:
            e.g., name: temperature name: pressure name: timestamp name: label To enhance
            interoperability, reuse, and AI-readiness (replace flat list above). - name:
            temperature description: Sample temperature at time of measurement data_type:
            float unit: Kelvin range: "273.15 - 373.15"'
          value:
            name:
              required: true
              description: " The name of the feature or variable."
              value: ${NAME}
            description:
              required: false
              description: " Detailed description of the entity."
              value: __DESCRIPTION__
            data_type:
              required: false
              description: " The data type of a feature or variable, following a controlled
                vocabulary from (e.g., float, int, string, boolean, datetime, other).
                This can provide important information about the nature of the data and
                can inform users about how to interpret and work with the dataset."
              type: dropdown
              options: [float, int, string, boolean, datetime, other]
              value: __DATA_TYPE__
            unit:
              required: false
              description: " The unit of measurement for a feature. This can provide important
                context for interpreting the values of the feature."
              value: __UNIT__
            range:
              required: false
              description: " The range of values for a feature. This can provide important
                information about the expected values for a feature and can inform users
                about how to work with the data effectively."
