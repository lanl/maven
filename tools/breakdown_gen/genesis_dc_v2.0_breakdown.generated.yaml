                replace the authoritative fields such as the classification_status,
                classification_level, export_control_basis, or privacy_control_basis
                fields. Authoritative source markings and metadata fields should be used
                for access control and governance decisions. Use "Public" for
                unclassified, non-sensitive assets that can be shared publicly. Allowed
                values: Public | Unclassified_Uncontrolled | CUI | UCNI | Classified |
                Legacy_Controlled | Mixed | Other_Controlled'
