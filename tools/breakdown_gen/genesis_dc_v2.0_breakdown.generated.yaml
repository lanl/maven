              value: ${CODE}
            description:
              required: false
              description: " Required if an entry is added. A description of what the missing data
                code represents."
              value: ${DESCRIPTION}
    citation:
      required: false
      description: " Citation information for the dataset, if applicable. Required when
        release_status = Approved | Published. This can provide users with the necessary
        information to properly cite the dataset in their work."
