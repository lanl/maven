          description: ' The SPDX license identifier for the dataset, use the SPDX license
            identifier: https://spdx.org/licenses/ Use "Other" if not in SPDX registry.
            Use "Pending" if not yet assigned. This provides a standardized way to
            indicate the license for the dataset and can inform users about the legal
            permissions and restrictions associated with using the data. e.g., CC-BY-4.0
            | CC0-1.0 | Apache-2.0 | MIT | Other | Pending'
          value: __SPDX_ID__
        name:
          required: false
          description: " The human-readable name of the license."
          value: __NAME__
        url:
          required: false
          description: " URL to a license. This can provide users with direct access to the full
