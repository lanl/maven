ai_usability:
  required: true
  description: " Metadata fields that support the AI usability of the dataset, These fields provide
    critical information about the allowed ai use for AI purposes, as well as any
    restrictions, biases, risks, safety considerations, and other factors related to
    using the dataset for AI purposes. The ai_usability capability is required for
    datacards of datasets that are intended to be used for AI training, evaluation, or
    other AI-related purposes."
  value:
    ai_usage:
      required: true
      description: " Describes whether and how this dataset may be used in AI/ML workflows. Be
        explicit — these fields are read by automated pipeline tooling. This can provide
        important information about the suitability of the dataset for AI/ML applications
        and can inform users about any specific considerations or restrictions related to
        using the dataset in AI/ML workflows."
      value:
        training_use_status:
          required: true
          description: ' The status of whether this dataset can be used for training in AI/ML
            workflows. Allowed values: "Yes" | "No" | Conditional'
          type: dropdown
          options: ["Yes", "No", Conditional]
          value: ${TRAINING_USE_STATUS}
        training_use_conditions:
          required: false
          description: ' If training_use_status is "Conditional", this field is required and
            describes the specific conditions or restrictions that must be met for the
            dataset to be used for training AI models. This can provide users with
            important information about any limitations or considerations they should be
            aware of when using the dataset for training AI models.'
          value: __TRAINING_USE_CONDITIONS__
        inference_use_status:
          required: true
          description: ' The status of whether this dataset can be used for inference in AI/ML
            workflows. Allowed values: "Yes" | "No" | Conditional'
          type: dropdown
          options: ["Yes", "No", Conditional]
          value: ${INFERENCE_USE_STATUS}
        inference_use_conditions:
          required: false
          description: ' If inference_use_status is "Conditional", this field is required and
            describes the specific conditions or restrictions that must be met for the
            dataset to be used for inference with AI models. This can provide users with
            important information about any limitations or considerations they should be
            aware of when using the dataset for inference with AI models.'
          value: __INFERENCE_USE_CONDITIONS__
        evaluation_use_status:
          required: true
          description: ' The status of whether this dataset can be used for evaluation in AI/ML
            workflows. Allowed values: "Yes" | "No" | Conditional'
          type: dropdown
          options: ["Yes", "No", Conditional]
          value: ${EVALUATION_USE_STATUS}
        evaluation_use_conditions:
          required: false
          description: ' If evaluation_use_status is "Conditional", this field is required and
            describes the specific conditions or restrictions that must be met for the
            dataset to be used for evaluation of AI models. This can provide users with
            important information about any limitations or considerations they should be
            aware of when using the dataset for evaluation of AI models.'
          value: __EVALUATION_USE_CONDITIONS__
        restrictions:
          required: true
          description: ' Any specific restrictions or conditions related to using this dataset in
            AI/ML workflows, if applicable. Be explicit if there are no applicable
            restrictions (e.g., "not_applicable") rather than leaving this field blank.
            This can provide users with important information about any limitations or
            considerations they should be aware of when using the dataset in AI/ML
            applications. e.g., Not for clinical decision-making | Dataset is intended
            for research purposes only and should not be used for commercial
            applications. | Dataset is subject to data use agreement restrictions that
            limit its use to non-commercial research purposes. | not_applicable'
          value: ${RESTRICTIONS}
        bias_risks:
