        report_number:
          required: false
          description: " Report number or other unique identifier for the dataset. This can provide
            users with an additional identifier for the dataset that can be used in
            citations and references. e.g., SAND2024-XXXXX | LAUR-XX-XXXXX |
            ORNL/TM-2024/XXXXX"
          value: __REPORT_NUMBER__
        preferred_citation:
          required: false
          description: " Fields that can be used to create full, preferred/recommended citation in
            bibtex format for the dataset. The fields author, title, year, publisher are
            required if preferred_citation is provided. At least one of doi or url must
            be provided if preferred_citation is provided."
          value:
            author:
              required: false
              description: " Author(s) of the dataset, if applicable. author: is intended as a
                component of a bibtex citation when preferred_citation is provided.
                Required when a preferred_citation is provided."
              value: ${AUTHOR}
            title:
              required: false
              description: " Title of the dataset, if applicable. title: is intended as a component
                of a bibtex citation when preferred_citation is provided. Required when a
                preferred_citation is provided."
              value: ${TITLE}
            year:
              required: false
              description: " Year of publication or release of the dataset, if applicable. year: is
                intended as a component of a bibtex citation when preferred_citation is
                provided Required when a preferred_citation is provided. This can provide
                users with temporal context for the dataset, which can inform their
                understanding of its relevance and currency."
              value: ${YEAR}
            publisher:
              required: false
              description: " Publisher or distributing organization for the dataset. publisher: is
                intended as a component of a bibtex citation when preferred_citation is
                provided This can provide users with information about the organization
                responsible for distributing the dataset."
              value: __PUBLISHER__
            howpublished:
              required: false
              description: " How the dataset was published or released. how_published: is intended
                as a component of a bibtex citation when preferred_citation is provided
                e.g., Online | In Repository | As Supplementary Material"
              value: __HOWPUBLISHED__
            doi:
              required: false
              description: " Digital Object Identifier (DOI) for the dataset. doi: is intended as a
                component of a bibtex citation when preferred_citation is provided
                Required when a preferred_citation is provided. This can provide users
                with a persistent identifier for the dataset that can be used in
                citations and references."
              value: __DOI__
            url:
              required: false
              description: " A url that resolves to the dataset landing page or other primary
                reference for the dataset, which can be used in citations and for users
                to access the dataset. url: is intended to correspond to the bibtex url
                field, and should be populated with the same value."
              value: __URL__
            eprinttype:
              required: false
              description: " The type of eprint identifier provided in the url field. eprinttype: is
                intended as a component of a bibtex citation when preferred_citation is
                provided. e.g., arXiv | report_number | pubmed"
              value: __EPRINTTYPE__
            eprint:
              required: false
              description: " The eprint identifier for the dataset. Value with correspond to the
                format of the eprinttype provided (e.g., arXiv, report_number, pubmed).
                eprint: is intended as a component of a bibtex citation when
                preferred_citation is provided. e.g., 1234.56789 | SAND2024-XXXXX"
              value: __EPRINT__
            note:
              required: false
              description: ' Additional notes related to the preferred citation, if any. Is intended
                to align with bibtex "note" field when preferred_citation is provided.
                For legacy bibtex entries that don''t accept eprinttype and eprint and
                that need to support an ark or other identifiers that don''t fit cleanly
                into the existing fields, the note field can be used to capture this
                information in a free-text format. include a note: field use this format
                for the note field: note: Available at ark:/12345/abcde'
              value: __NOTE__
    integrity:
      required: true
      description: " Contains elements describing checksums enable automated validation of data
        integrity after transfer or storage."
      value:
        checksum_available:
          required: false
          description: " Whether a checksum is available for this dataset, which can be used to
            verify the integrity of the data after transfer or storage."
          type: radio
          options: ["Yes", "No"]
          value: __"Yes|No"__
        checksum_type:
          required: false
          description: ' The type of checksum available for this dataset. Required if
            checksum_available="Yes". This can provide users with information about the
            method used to generate the checksum, which can inform their decisions about
            how to use the checksum for data integrity verification.'
          value: __CHECKSUM_TYPE__
        checksum_value:
          required: false
          description: ' The value of the checksum for this dataset, if applicable. Required if
            checksum_available="Yes". This can be used by users to verify the integrity
            of the data after transfer or storage by comparing the provided checksum
            value with a newly generated checksum from the transferred or stored data.'
          value: __CHECKSUM_VALUE__
        fixity_policy:
          required: false
          description: " Information about the fixity policy for this dataset, including how often
            fixity checks are performed and any specific procedures or tools used for
            fixity verification. e.g., Monthly sha256 verification via repository
            integrity service"
          value: __FIXITY_POLICY__

governed_use:
  required: true
  description: " Metadata fields that support the governed use of the dataset, which is essential
    for ensuring that the dataset is shared and accessed in compliance with applicable
    regulations, policies, and ethical considerations, and for enabling responsible use
    of the dataset by others. The governed_use capability is required for datacards of
    datasets that are intended to be shared or accessed under specific governance or
    oversight, such as datasets that are subject to security controls, export control, or
    other types of formal review and approval processes."
  value:
    use_governance:
      required: true
      description: " Information block to guide appropriate use and prevent misuse of this dataset."
      value:
        current_use:
          required: true
          description: " What is this dataset actively being used for right now? Distinct from
            intended_use."
          value: ${CURRENT_USE}
        intended_use:
          required: false
          description: " Purpose and intended use stated to enable users to make a decision as to
            the suitability of this work (e.g., lab protocol, machine learning model,
            software) to their experimental problem or own use case. e.g., ML training |
            physics analysis | benchmarking | visualization"
          value: __INTENDED_USE__
        permitted_use:
          required: false
          description: " Uses this dataset is suitable for, beyond the intended use. Genesis
            governance expects explicit permitted use metadata at the governance level,
            which is why this field is distinct from intended_use. Be explicit about what
            this dataset is suitable for, to guide users and prevent misuse. e.g., AI
            workflows | research and publication | internal analysis | educational use"
          value: __PERMITTED_USE__
        out_of_scope_use:
          required: false
          description: " Uses this dataset should NOT be applied to. e.g., clinical decision-making
            | real-time control systems"
          value: __OUT_OF_SCOPE_USE__
        prohibited_use:
          required: false
          description: " Uses that are explicitly prohibited for this dataset, either due to ethical
            considerations, safety concerns, or other governance reasons. Be explicit
            about what this dataset should not be used for, to guide users and prevent
            misuse. e.g., commercial use | AI workflows | redistribution | use by foreign
            nationals | clinical decision-making | real-time control systems"
          value: __PROHIBITED_USE__
    non_sensitivity_governance_metadata:
      required: true
      description: " Governance-relevant metadata that may affect sharing/use decisions but is not
        part of the source sensitivity/marking block itself. This refers to the
        non-sensitivity governance as it applies to the dataset, which may be distinct
        from the sensitivity or classification of the source data from which it was
        derived."
      value:
        export_control:
          required: true
          description: " Includes fields related to export control considerations for the dataset,
            if applicable. Provides users with important information about any export
            control restrictions or requirements that may apply to the dataset."
          value:
            export_control_status:
              required: true
